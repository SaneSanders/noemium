name: Gemini Nano Banana 2
tagline: Gemini's native image model (gemini-3.1-flash-image) — generate/edit in the Gemini app and Gemini API.
url: https://ai.google.dev/gemini-api/docs/image-generation
category: image
pricing: freemium
price_note: "Gemini app: included with plan caps (Free limited; Plus/Pro/Ultra expand); API billed as Gemini image tokens — confirm live rates on Google AI pricing (not Imagen 4)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Nano Banana is Gemini's image stack, not Imagen 4. Nano Banana 2 is the
  3.1 Flash Image workhorse (4K, references, text in image); Lite is the
  cheap/fast sibling. App access follows Google AI Plus/Pro/Ultra. API is
  token-priced per resolution. No studio run in this pass.
strengths:
  - Native 4K image generation and editing inside the Gemini app and API.
  - Supports references and rendered text in images via Nano Banana 2.
  - Lite variant offers a cheaper, faster sibling for less demanding work.
  - API bills as Gemini image tokens tied to output resolution.
use_for:
  - Gemini app users on Plus/Pro/Ultra who want native image generation.
  - Developers already calling the Gemini API for image edits and creation.
skip_when:
  - You need Imagen 4 capabilities or pricing — this is a different model family.
  - You want a fixed per-image rate card instead of token-priced API billing.
  - Lite must handle multi-reference images or long sequential edits.
limitations:
  - Not Imagen 4 — different model family, different console, different bill.
  - App image caps are plan- and region-gated (Nano Banana Pro in Search is a separate note).
  - Lite is not built for multi-reference or long sequential edits.
  - Gemini API prices move; the image-generation doc is the receipt, not a screenshot of $/image.
receipts:
  - https://ai.google.dev/gemini-api/docs/image-generation
  - https://gemini.google/subscriptions/
affiliate: none
evidence_tier: source-verified
momentum: blueshift
