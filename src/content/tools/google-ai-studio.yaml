name: Google AI Studio / Gemini API
tagline: Gemini API with a real free tier — huge context, multimodal, generous limits.
url: https://aistudio.google.com
category: models-api
pricing: freemium
price_note: "free tier (text models); paid from $0.75/1M input (Gemini 3.7 Flash promo till 2027-01)"
free_tier: true
open_source: false
api: true
self_host: false
models_used:
  - gemini-3-1-pro-preview
  - gemini-3-7-flash
model_routing: locked
verdict: ship
verdict_text: >-
  Gemini has the most useful free API tier going, and paid plans undercut
  rivals for long-context and multimodal work. Million-token context makes
  document workflows cheap here that get expensive elsewhere. Watch the
  fast-moving model names and the 2027-01 promo expiry.
strengths:
  - "Most useful free Gemini API tier going, plus cheap long-context paid plans."
  - Million-token context makes document jobs cheap that get expensive elsewhere.
use_for:
  - Multimodal and long-document prototypes on the free tier.
  - Production Gemini calls when Flash promo pricing still holds.
skip_when:
  - Free-tier prompts used for training is a non-starter.
  - Safety filters over-trigger on your domain.
  - You need image or video generation on the free tier.
limitations:
  - Free-tier prompts may be used for training — read the terms.
  - Safety filters occasionally over-trigger.
  - API surface and model names change quickly.
  - Image/video generation is paid-tier only; Flash promo prices double 2027-01-01.
receipts:
  - https://ai.google.dev/gemini-api/docs/pricing
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
last_verified: "2026-09-01"
