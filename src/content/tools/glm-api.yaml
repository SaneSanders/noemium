verdict: situational
verdict_text: >-
  GLM-5.2 is a serious open-weights flagship with a huge context window, and
  the flat-rate Coding Plan is genuinely different. The catch is Zhipu's
  international surface is thinner than Qwen's, with CNY pricing, lower brand
  recognition and a promo price that may not last.
limitations:
  - The hosted API is proprietary; some GLM model weights are available separately for self-hosting.
  - Pricing page is CNY-only and tiered by input/output length.
  - GLM-5.3 and GLM-5.2 were temporarily free at scan time — promo pricing may end without notice.
  - Western brand recognition and documentation are lower than Qwen/DeepSeek/Kimi.
  - International sign-up and billing can be less straightforward.
