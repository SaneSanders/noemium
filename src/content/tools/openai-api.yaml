name: OpenAI API
tagline: GPT-5 family and o-series reasoning models behind one API.
url: https://platform.openai.com
category: models-api
pricing: paid
price_note: "pay-as-you-go, from $0.20/1M input (GPT-5.6 Luna); no free tier"
free_tier: false
open_source: false
api: true
self_host: false
models_used:
  - gpt-5-6-terra
  - gpt-5-4-mini
  - gpt-5-6-sol
