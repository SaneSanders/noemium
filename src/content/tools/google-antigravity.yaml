name: Google Antigravity
tagline: Google's agentic development platform — free individual tier, paid quota via AI Pro/Ultra, orgs via Cloud.
url: https://antigravity.google
category: coding
pricing: freemium
price_note: "individual $0/mo with weekly agent caps; higher quota via Google AI Pro $19.99/mo or Ultra from $99.99/mo; orgs via Google Cloud consumption"
free_tier: true
open_source: false
api: false
self_host: false
models_used:
  - gemini-3-1-pro-preview
model_routing: bundled
verdict: situational
verdict_text: >-
  A real Google coding surface, not Gemini Code Assist: agent models (Gemini,
  Claude, gpt-oss) inside Antigravity, unlimited tab/command on the free
  individual plan, paid quota bolted onto Google AI Pro/Ultra. Rate-limit
  opacity is the tax. Separate from the Gemini consumer app and from Code Assist.
strengths:
  - "Real Google coding surface with agent models from multiple labs."
  - "Free individual tier with unlimited tab and command completions."
  - "Paid quota through familiar Google AI Pro/Ultra subscriptions."
use_for:
  - "Developers who want a Google-native agentic coding environment."
  - "Individual users who can stay within weekly free-tier agent caps."
  - "Teams already buying Google AI Pro/Ultra for extra quota."
skip_when:
  - "You need a published token rate card for agent quota."
  - "You cannot risk hitting a weekly cap mid-project."
  - "You want to plug into existing JetBrains/VS Code via Gemini Code Assist."
limitations:
  - Agent quota is weekly/credit-shaped; the public page does not publish a token rate card.
  - Hitting the cap locks you until refresh unless you buy AI credits or Ultra.
  - Organization access is Google Cloud / Gemini Enterprise, not a self-serve IDE seat.
  - Not a replacement for Gemini Code Assist in existing JetBrains/VS Code installs.
receipts:
  - https://antigravity.google/pricing
  - https://gemini.google/subscriptions/
affiliate: none
momentum: blueshift
featured: false
last_verified: "2026-08-19"
observed_by: whysanesanders
