verdict: situational
verdict_text: >-
  n8n-shaped, MIT-flavored: unlimited flows, AI steps, MCP, and an honest
  split between Community Edition (flows) and paid (agents/chat, SSO, Git
  sync). Plus at $16/yr-billed is the BYOK on-ramp. Credit math is 1 per flow
  run, more for hosted models. Not Zapier-scale connectors.
limitations:
  - Community Edition drops Agents/Chat, API access, SSO, and Git Sync.
  - Free cloud is daily credits with a hard cap; overage does not PAYG.
  - Hosted AI steps cost 2–20 credits unless you BYOK (then 1 credit).
  - Connector coverage is thinner than Zapier/Make; HTTP piece is the escape hatch.
