name: Activepieces
tagline: Open-source automation — unlimited flows, agents, MCP; cloud credits or Community Edition on-prem.
url: https://www.activepieces.com
category: automation
pricing: freemium
price_note: "Free $0 (daily credits, 1 user); Plus $16/mo billed yearly; Team $166/mo billed yearly; Ultimate custom; Community Edition self-host free (core flows only)"
free_tier: true
open_source: true
api: true
self_host: true
verdict: situational
verdict_text: >-
  n8n-shaped, MIT-flavored: unlimited flows, AI steps, MCP, and an honest
  split between Community Edition (flows) and paid (agents/chat, SSO, Git
  sync). Plus at $16/yr-billed is the BYOK on-ramp. Credit math is 1 per flow
  run, more for hosted models. Not Zapier-scale connectors.
strengths:
  - Open-source automation with unlimited flows and an honest split between free Community Edition and paid features.
  - MIT license plus self-hosted Community Edition for teams that need data on-prem.
  - AI steps, MCP support, and a BYOK option to cut hosted model credit costs.
use_for:
  - Teams that want n8n-style automation under an MIT license with self-hosting.
  - Workflows that mix SaaS plumbing with occasional AI steps.
  - Budget-conscious shops that can run Community Edition and bring their own model keys.
skip_when:
  - You need Zapier-scale connector breadth out of the box.
  - Community Edition covers your flows but you also need Agents, Chat, SSO, or Git Sync.
  - You cannot manage self-hosting or BYOK model keys.
model_routing: byok
limitations:
  - Community Edition drops Agents/Chat, API access, SSO, and Git Sync.
  - Free cloud is daily credits with a hard cap; overage does not PAYG.
  - Hosted AI steps cost 2–20 credits unless you BYOK (then 1 credit).
  - Connector coverage is thinner than Zapier/Make; HTTP piece is the escape hatch.
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
receipts:
  - https://www.activepieces.com/pricing
  - https://github.com/activepieces/activepieces
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
last_verified: "2026-08-24"
