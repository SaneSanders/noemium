verdict_text: >-
  The best price-performance around for reasoning workloads — R1-class output
  at a fraction of frontier cost. The catch is China hosting: plenty of
  companies simply can't send data there. When compliance allows, it's a
  no-brainer.
limitations:
  - Data residency is a compliance blocker for many orgs.
  - API capacity and reliability have wobbled under demand.
  - Censorship baked in on some topics.
  - Complex peak/off-peak rate card with 50% discount outside 01:00–04:00 and 06:00–10:00 UTC from 2026-08-16; cache-hit discounts matter but add opacity.
