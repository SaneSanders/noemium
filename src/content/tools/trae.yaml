name: Trae
tagline: ByteDance's AI-native IDE with inline completion, chat and autonomous SOLO agent mode.
url: https://www.trae.ai
category: coding
pricing: freemium
price_note: "Free plan with monthly AI allowance; paid tiers Lite $3/mo, Pro $10/mo, Pro+ $30/mo, Ultra $100/mo (token-based); pricing changed 2026-02-18"
free_tier: true
open_source: false
api: false
self_host: false
models_used:
  - claude-sonnet-5
verdict: situational
model_routing: bundled
verdict_text: >-
  The cheapest way into a full AI IDE, and Lite at $3/mo undercuts everyone.
  The trade-off is ByteDance hosting your code with no BYOK option; fine for
  side projects, risky for proprietary work.
strengths:
  - "Cheapest way into a full AI IDE: free plan plus Lite at $3/mo undercuts rivals."
  - Inline completion, chat, and autonomous SOLO agent mode in one editor.
  - Fast start for developers already used to VS Code-like layouts.
use_for:
  - Side projects and budget-conscious developers who want an AI-native IDE.
  - Developers comfortable with ByteDance hosting for non-proprietary code.
skip_when:
  - You are working on proprietary code and cannot accept ByteDance data handling.
  - You need BYOK, a standalone API, or audited closed-source tooling.
  - Western documentation and support quality are critical.
limitations:
  - ByteDance product — data and privacy concerns for proprietary code.
  - Token allowances can run out quickly on heavy agent sessions.
  - Closed source; no BYOK or standalone API.
  - Western documentation and support are thinner than Cursor/Windsurf.
