  side projects, risky for proprietary work.
limitations:
  - ByteDance product — data and privacy concerns for proprietary code.
  - Token allowances can run out quickly on heavy agent sessions.
  - Closed source; no BYOK or standalone API.
  - Western documentation and support are thinner than Cursor/Windsurf.
