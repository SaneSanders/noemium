name: Firecrawl
tagline: Turn entire websites into clean, LLM-ready markdown or structured data.
url: https://www.firecrawl.dev
category: data
pricing: freemium
price_note: "open source self-host free; cloud 1,000 credits/mo free, then Hobby/Standard/Growth paid"
free_tier: true
open_source: true
api: true
self_host: true
verdict: ship
verdict_text: >-
  The go-to tool for scraping site content into markdown for RAG. Handles
  dynamic sites well and the self-hosted option keeps costs down. Very large
  sites need rate-limiting and chunking discipline.
strengths:
  - "Go-to scrape-to-markdown path for RAG, including many dynamic sites."
  - Self-host option keeps cloud page-volume pricing off the critical path.
use_for:
  - Turning a docs site or blog into LLM-ready markdown.
  - "RAG pipelines that need structured extraction, not raw HTML."
skip_when:
  - The target is a huge site you cannot rate-limit and chunk.
  - The app is a brittle JavaScript SPA that still breaks extraction.
  - Cloud crawl volume is the only option and the bill would spike.
limitations:
  - Large sites require careful rate limiting and caching.
  - Complex JavaScript apps can still break extraction.
  - Cloud pricing climbs with page volume.
receipts:
  - https://www.firecrawl.dev
  - https://github.com/mendableai/firecrawl
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
guide:
  install: Cloud at firecrawl.dev or self-host from mendableai/firecrawl. Start with the cloud free credits.
  requirements:
    - A target site you are allowed to crawl
    - A sink (markdown files or a vector store)
  cost: >-
    OSS self-host is free. Cloud: 1,000 credits/mo free, then Hobby/Standard/Growth. Page volume is the bill.
  security: Crawling sends the target HTML to Firecrawl Cloud unless you self-host. Do not point it at authenticated app pages you do not own.
  breaks_when:
    - The site is a brittle SPA and extraction comes back empty.
    - You crawl a huge site with no rate limit and get banned.
last_verified: "2026-08-19"
observed_by: whysanesanders
