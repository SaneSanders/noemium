verdict_text: >-
  Voice platform with an unusually readable API card: $15 per million UTF-8
  bytes of input text (~12h speech), plus a $0 s2.1-pro-free string for
  prototypes. Free web plan is personal-use. Commercial rights and latency
  SLAs are paid. Not ElevenLabs, not CosyVoice. No production dub in this pass.
limitations:
