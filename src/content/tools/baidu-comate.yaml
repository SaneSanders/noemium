name: Baidu Comate
tagline: Baidu's AI coding assistant with completion, chat, and Zulu agent mode for Chinese developers.
url: https://comate.baidu.com
category: coding
pricing: freemium
price_note: "Standard free for individuals; Pro starts at ¥1 for the first month then ¥60/mo (or ¥500/yr); Enterprise from ¥799/seat/yr; new signups receive ¥10 model credit"
free_tier: true
open_source: false
api: false
self_host: false
model_routing: locked
verdict: situational
verdict_text: >-
  A sensible choice for Chinese-speaking teams already using Baidu's cloud stack
  and ERNIE models. The catch: the most useful agentic features sit behind Pro or
  Enterprise tiers, and non-Chinese users will hit language, payment, and support
  friction.
strengths:
  - "Tight fit for Chinese-speaking teams already on Baidu Cloud and ERNIE models."
  - "Standard tier is free for individuals."
  - "Includes Zulu agent mode for users on Pro or Enterprise tiers."
use_for:
  - "Developers working in Chinese who want an IDE assistant inside Baidu's stack."
  - "Teams already paying for Baidu Cloud and ERNIE services."
skip_when:
  - "Your team needs English-first documentation and support."
  - "You want agentic features without paying for Pro or Enterprise."
  - "You need BYOK or an open model ecosystem."
limitations:
  - Documentation and support are Chinese-first.
  - Agentic and advanced generation features require Pro or Enterprise.
  - Not open source; tied to the Baidu ERNIE model ecosystem.
  - Enterprise pricing starts at ¥799/seat/year; dedicated support only at 1000+ seats.
  - International availability and payment methods are unclear.
