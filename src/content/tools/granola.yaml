name: Granola
tagline: AI notepad for meetings — your rough notes enhanced, no bot in the call.
url: https://www.granola.ai
category: productivity
pricing: freemium
price_note: "free Basic tier; Business $14/user/mo; Enterprise $35/user/mo"
free_tier: true
open_source: false
api: true
self_host: false
verdict: ship
verdict_text: >-
  A notepad that listens and fills in the gaps — no bot in the call, just
  your rough notes enhanced with transcript detail. Apple-only for now, and
  the team features are still young, but it solves the meeting-notes problem
  better than the bot-in-call crowd.
strengths:
  - "Meeting notes without a bot in the call — your rough notes, filled in."
  - Solves the notes job better than the bot-in-the-room crowd.
use_for:
  - Founders and ICs who already take notes and want the transcript fused in.
  - Apple-first teams that refuse a meeting bot.
skip_when:
  - The team is on Windows.
  - System-audio capture keeps failing on your machines.
  - You need mature team admin and pricing.
limitations:
  - Apple-platform-centric; Windows users wait.
  - System-audio capture has setup quirks on some machines.
  - Team pricing and admin controls still maturing.
