name: GPT Image 2
tagline: OpenAI's image generation/editing model (ChatGPT Images in the app; gpt-image-2 on the API).
url: https://developers.openai.com/api/docs/models/gpt-image-2
category: image
pricing: freemium
price_note: "in ChatGPT: Free/Go limited, Plus expanded, Pro unlimited/faster; API gpt-image-2 $8/1M image-in, $2 cached, $30/1M image-out, $5/1M text-in"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  This is the image job, not a second ChatGPT card. In the app it rides
  ChatGPT plan caps; on the API it is token-priced (image out is the expensive
  line). Free API tier does not include it. Quality/size settings change the
  token count — use OpenAI's calculator, not a flat $/image folklore.
strengths:
  - "Native image generation/editing inside the ChatGPT app and API."
  - "Token pricing is published, though the per-image cost depends on settings."
use_for:
  - "Image generation inside a ChatGPT plan you already use."
  - "API image jobs where token-based billing fits your existing OpenAI workflow."
skip_when:
  - "You rely on the OpenAI API Free tier — GPT Image 2 is not supported there."
  - "You need a flat per-image rate rather than a token calculator."
  - "Video is the job; that is a different OpenAI SKU."
limitations:
  - API is token-priced; a "per image" number depends on quality, size, and edits.
  - "Not available on the OpenAI API Free tier (TPM table: Not supported)."
  - ChatGPT image quotas are plan-gated and slower on Free/Go.
  - This is not DALL·E 3 and not Sora; video is a different OpenAI SKU.
receipts:
