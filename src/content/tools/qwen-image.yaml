name: Qwen-Image
tagline: Alibaba Cloud text-to-image and image-editing models, including Qwen-Image 2.0 and Plus/Max variants.
url: https://github.com/QwenLM/Qwen-Image
category: image
pricing: paid
price_note: "Qwen-Image 2.0 ~$0.029/image, Image Plus ~$0.0287/image, Image Edit Max similar per-image rate"
free_tier: true
open_source: true
api: true
self_host: true
verdict: situational
verdict_text: >-
  Cheap image generation and editing through the same Alibaba Cloud account as
  Qwen text. It's not Midjourney or top-tier Flux, but the price and
  text-in-image accuracy make it a practical choice for apps and bulk
  workflows.
strengths:
  - Cheap per-image generation and editing through an existing Alibaba Cloud account.
  - Text-in-image accuracy is a practical edge over some cheaper rivals.
  - Useful for apps and bulk workflows that prioritize cost over absolute quality.
use_for:
  - Bulk image generation or editing pipelines that need low unit cost.
  - Apps already using Qwen text models and Alibaba Cloud services.
skip_when:
  - You need top-tier image quality comparable to Midjourney or best Flux.
  - China-region compliance and data-residency rules are a hard no.
  - Editing volume would make the separate editing endpoint costs add up.
limitations:
  - Quality tier below top closed image models.
  - Western awareness and community resources are lower than Midjourney/Flux.
  - China-region compliance and data-residency rules apply.
  - Editing endpoints are priced separately and can add up.
