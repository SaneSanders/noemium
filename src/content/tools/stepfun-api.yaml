name: StepFun API
tagline: API for Step-2/Step-3 family of frontier MoE models from Shanghai.
url: https://platform.stepfun.com
category: models-api
pricing: paid
price_note: "Step 3.7 Flash ~$0.20/$1.15 per 1M; Step 3.5 Flash open-source $0.10/$0.30; Step-2 ~$0.83/$2.50; Step-2-mini ~$0.14/$0.42; Step-1.5V ~$0.42/$1.25; Step-R ~$1.11/$3.33"
free_tier: true
open_source: false
api: true
self_host: false
model_routing: locked
verdict: situational
verdict_text: >-
  Step 3.7 Flash is cheap, open weights, and scores well on coding and math
  benchmarks. Step-2 is a capable closed model at mid-tier prices. Brand
  recognition and docs outside China are weak, and access often runs through
  resellers.
strengths:
  - Step 3.7 Flash is cheap, open weights, and strong on coding and math.
  - Step-2 is a capable closed model at mid-tier prices.
  - The family covers text, vision, and reasoning variants.
use_for:
  - Cost-sensitive coding and math workloads that fit the Flash SKUs.
  - Teams that want Step-2's closed-model quality without premium pricing.
skip_when:
  - You need strong Western brand recognition and English-first docs.
  - You want one API key that works across China and global platforms.
  - You need a model family as broad as Qwen or Tencent.
limitations:
  - The hosted API is proprietary; Step 3.5 Flash and Step 3.7 Flash weights are separate open-weight releases.
  - StepFun runs separate China (platform.stepfun.com) and global (platform.stepfun.ai) platforms with non-interchangeable API keys.
  - Lower Western brand recognition; docs mostly Chinese.
  - Mixed access outside China; often reached via resellers.
  - Step-2 is closed, unlike Step 3.5 Flash and Step 3.7 Flash.
  - Smaller model family than Qwen or Tencent.
