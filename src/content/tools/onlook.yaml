name: Onlook
tagline: Open-source visual editor that writes code directly into your React project.
url: "https://onlook.com"
category: design
pricing: freemium
price_note: free open-source; paid cloud collaboration
free_tier: true
open_source: true
api: false
self_host: true
verdict: situational
verdict_text: >-
  Promising for teams that want a designer-friendly layer on top of a real codebase. It is still early, so expect rough edges and occasional sync issues.
limitations:
  - Early-stage; breaking changes are common.
  - Works best with specific React setups.
  - Cloud collaboration features are not essential for solo use.
strengths:
  - Open-source visual editor that writes code directly into your React project.
  - Designer-friendly layer on top of a real codebase.
use_for:
  - React teams that want a visual editor synced to a real codebase.
  - Designers and developers who share the same React repository.
skip_when:
  - You need a stable, mature tool without breaking changes.
  - Your stack is not one of the React setups Onlook supports well.
  - Solo users who don't need the paid cloud collaboration tier.
