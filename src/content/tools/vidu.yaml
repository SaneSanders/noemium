name: Vidu
tagline: Text/image/reference-to-video generator with native audio and strong character consistency.
url: https://www.vidu.com
category: video
pricing: freemium
price_note: "free plan includes 80 credits/mo plus unlimited off-peak generation; paid plans credit-based; API credits $0.005 each but generations priced per operation by model/resolution/duration (Q2-turbo 540P from $0.03, Q2-Pro 1080P from $0.425)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Strong reference-to-video consistency and a cheap entry point for creators.
  The aesthetic leans cinematic/anime, the API pricing matrix is complex, and
  the vendor is smaller and China-based.
strengths:
  - Strong reference-to-video consistency for characters.
  - Cheap entry point with free credits plus unlimited off-peak generation.
  - Native audio generation baked into the video output.
use_for:
  - Cinematic or anime-style narrative videos.
  - Projects that lean on reference images for consistent characters.
skip_when:
  - You need UGC or e-commerce ad aesthetics.
  - The complex API pricing matrix is a procurement barrier.
  - You need strong Western vendor support and access.
limitations:
  - Aesthetic leans cinematic/anime/narrative, less suited for UGC or e-commerce ads.
  - API pricing matrix is complex.
  - Smaller vendor with China-based operations.
  - Western access and support are thinner than Runway or Kling.
