verdict: situational
verdict_text: >-
  Strong research-oriented framework with role-playing agents and memory.
  Useful for academic and prototype work. Smaller ecosystem and less tooling
  than AutoGen or CrewAI.
strengths:
  - "Research-oriented framework with role-playing agents and memory built in."
  - "Modular primitives for agents, societies, RAG, and synthetic data."
use_for:
  - "Academic experiments and agent prototype work."
  - "Multi-agent sketches where role-playing is central to the design."
skip_when:
  - "You need the integrations and community size of CrewAI or AutoGen."
  - "You want a clear production deployment path out of the box."
  - "Verbose role-playing setup would slow your iteration."
limitations:
  - Smaller community and fewer integrations than CrewAI.
  - Production deployment path is less mature.
  - Role-playing setup can be verbose.
