name: Replicate
tagline: Run any community model via API — pay per second, no GPU wrangling.
url: https://replicate.com
category: dev-infra
pricing: paid
price_note: "pay per run; image models from ~$0.003/image"
free_tier: false
open_source: false
api: true
self_host: false
model_routing: locked
verdict: ship
verdict_text: >-
  A quick way to run models you don't want to host yourself — thousands of
  community models behind one API, billed per second. Good for prototypes and
  workloads that spike. Steady-state use gets expensive, and quality varies
  because it's community-published.
strengths:
  - "Thousands of community models behind one API, billed per second, no GPU wrangling."
  - Good for prototypes and spiky workloads you do not want to host.
use_for:
  - Trying a community model this afternoon.
  - Burst inference that should die when the job ends.
skip_when:
  - Steady volume would make per-second pricing the expensive path.
  - Cold starts on obscure models would show up to users.
  - "You need guaranteed maintenance, not a community author."
limitations:
  - Per-second pricing gets expensive at steady volume.
  - Cold starts on less-popular models.
  - Model quality and maintenance vary by community author.
  - Acquired by Cloudflare (2025-11); API and pricing unchanged so far.
receipts:
  - https://replicate.com
  - https://replicate.com/pricing
affiliate: none
evidence_tier: source-verified
momentum: steady
featured: false
last_verified: "2026-09-01"
observed_by: whysanesanders
