verdict_text: >-
  M3 is cheap for high-volume text, and the same platform runs Hailuo video,
  speech and music. Just watch the pricing: list vs promo rates are unclear,
  and the open-weight flagship Text-01 has vanished from the main API docs.
limitations:
  - The hosted API is proprietary; any open-weight MiniMax models are separate releases.
  - Pricing page lists promo vs standard rates; promo expiration unclear.
  - MiniMax-Text-01, the open-weight flagship, appears deprecated or hidden from main API docs.
  - Western documentation and support are thinner than Qwen/DeepSeek.
  - Long-context input (>512K) is billed at 2× the standard rate.
