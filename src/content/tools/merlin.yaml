name: Merlin
tagline: Browser AI assistant — 70+ tools and top models in one extension, on every page.
url: https://www.getmerlin.in
category: productivity
pricing: freemium
price_note: free 102 queries/day; Pro $19/mo; Teams $15/seat/mo (5-seat min, $180/yr per seat)
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  An everything-in-one browser assistant: chat, writing, research and image
  tools behind a single subscription, available on any page. Convenient if you
  want one hub instead of a dozen tabs and logins. The bundle cuts both ways —
  "unlimited" runs on fair use, and a direct model subscription buys more
  control for similar money. Pick it for convenience, not for depth.
strengths:
  - Browser extension puts 70+ tools and top models on any page.
  - Single subscription replaces multiple model logins.
  - Free tier offers 102 queries/day to test the bundle.
use_for:
  - Users who want one browser hub instead of juggling model tabs.
  - Quick writing, research, and image tasks inside the existing browser flow.
skip_when:
  - '"Unlimited" Pro fair-use caps would throttle your volume.'
  - You need a single dedicated model with more control than the bundle allows.
  - You are buying for a team smaller than the 5-seat Teams minimum.
limitations:
  - '"Unlimited" Pro queries are subject to a fair-use policy.'
  - Free tier is capped at 102 queries per day.
  - Teams plan requires a 5-seat minimum.
