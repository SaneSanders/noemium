verdict_text: >-
  The smoothest managed vector DB to operate, and the free tier covers
  prototypes. But self-hosted Qdrant or pgvector now handle most workloads
  for a fraction of the cost — pay only if ops time is your bottleneck.
limitations:
  - Costs scale poorly versus self-hosted alternatives.
  - Proprietary; migrating away is a rewrite.
  - Pricing-model changes have burned users before.
