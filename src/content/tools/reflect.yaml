verdict: situational
verdict_text: >-
  Fast, keyboard-driven notes with AI summarization and strong privacy.
  The daily notes workflow is excellent for writers and thinkers. It is
  smaller and pricier than Notion, with fewer integrations.
limitations:
  - No free tier.
  - Integration ecosystem is small.
  - Mobile app is less mature than desktop.
strengths:
  - Fast, keyboard-driven daily notes workflow.
  - Built-in AI summarization.
  - End-to-end encryption for your notes.
use_for:
  - Writers and thinkers who want a daily notes habit.
  - Users who prioritize privacy in note-taking.
skip_when:
  - You need a free tier beyond the 14-day trial.
  - Rich third-party integrations are essential.
  - Your workflow is mobile-first.
