name: Amp
tagline: Sourcegraph's agentic coding product (not Cody) — subscription orbs plus linked ChatGPT/Grok usage.
url: https://ampcode.com
category: coding
pricing: paid
price_note: "Megawatt $20/mo (750 orb-hours, $20 included agent usage); Gigawatt $200/mo; unconstrained usage billing"
free_tier: false
open_source: false
api: true
self_host: false
model_routing: bundled
verdict: situational
verdict_text: >-
  Amp is the product Sourcegraph actually pushes; Cody is the skip. $20
  Megawatt includes agent usage and a pile of "orbs," and you can attach a
  ChatGPT or SuperGrok sub for extra tokens at no Amp markup. Closed, hosted,
  and still a second IDE habit. Cody remains a separate, enterprise-only card.
strengths:
  - Sourcegraph's current agentic coding push, with Cody kept as a separate enterprise card.
  - $20 Megawatt bundles agent usage and orb-hours for a low entry price.
  - Attach an existing ChatGPT or SuperGrok subscription at no Amp markup.
use_for:
  - Developers who want agentic coding inside a second IDE and already tolerate Sourcegraph.
  - Teams that already pay for ChatGPT or SuperGrok and want to reuse that spend.
  - Small teams that can live with manual workspace billing.
skip_when:
  - You need a free tier to evaluate before buying.
  - You expect orbs to act as a shared resale compute pool across the org.
  - You need auto-seat provisioning for a growing team.
limitations:
  - No public free tier on the Amp pricing page.
  - Orb hours and included agent dollars are two different meters.
  - Max two subscriptions per human; orbs are not a resale compute pool.
  - Team workspace billing is manual — no auto-seat provisioning yet.
receipts:
  - https://ampcode.com/pricing
  - https://sourcegraph.com/docs/cody
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
