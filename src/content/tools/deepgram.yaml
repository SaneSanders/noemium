name: Deepgram
tagline: Speech-to-text API built for developers — fast, cheap, real-time.
url: https://deepgram.com
category: audio
pricing: freemium
price_note: "$200 free credits; Nova-3 STT from $0.0048/min (promo)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: ship
verdict_text: >-
  A solid workhorse STT API: real-time streaming, decent accuracy, and
  cheaper than most rivals at volume. If self-hosting Whisper adds too
  much latency, this is the obvious fallback. Accuracy drops on heavy
  accents and noisy audio, and diarization needs per-case tuning. It's
  another vendor in your stack, but it does the job.
strengths:
  - "Workhorse streaming STT: fast, cheap at volume, good enough accuracy."
  - The obvious hosted fallback when self-hosted Whisper is too slow.
use_for:
  - Real-time transcription in a product voice pipeline.
  - Batch STT where per-minute cost matters more than perfect diarization.
skip_when:
  - Heavy accents and noise need a tuned Whisper setup.
  - Speaker diarization has to be right without per-case work.
  - You refuse another vendor in the voice stack.
limitations:
  - Accuracy on heavy accents and noise below a well-tuned Whisper setup.
  - Diarization and formatting need tuning per use case.
  - Another vendor dependency in your voice pipeline.
receipts:
  - https://deepgram.com
affiliate: none
momentum: steady
