name: GitHub Copilot
tagline: Completions, chat, agents, and Copilot CLI — one GitHub Copilot seat, not a third CLI product.
url: https://github.com/features/copilot
category: coding
pricing: freemium
price_note: "Free $0 (2,000 completions/mo, 50 chat requests, CLI, limited agent mode); Pro $10/mo ($15 credits); Pro+ $39/mo ($70 credits); Max $100/mo ($200 credits)"
free_tier: true
open_source: false
api: false
self_host: false
models_used:
  - gpt-5-6-terra
  - claude-sonnet-5
model_routing: bundled
verdict: ship
verdict_text: >-
  The zero-friction option if your team already lives on GitHub. Fast
  completions, real PR integration, a free tier that's actually usable, and
  Copilot CLI is on that same seat (not a separate catalog card). Agent
  mode still trails Cursor and Claude Code. Pro+ unlocks third-party
  agents (Claude Code, Codex) inside the GitHub bill.
strengths:
  - Zero friction if the team already lives on GitHub — one seat, IDE + CLI.
  - A free tier that is actually usable (completions, chat, limited agent).
  - PR integration that other agents still treat as an afterthought.
use_for:
  - Teams standardized on GitHub who want completions and light agent work.
  - A first coding agent that should not be a second vendor conversation.
skip_when:
  - Multi-step agent work is the job — Cursor and Claude Code still lead.
  - You need a predictable bill; chat, agent, CLI, and cloud share AI Credits.
  - You want to self-host or keep code off GitHub's models.
limitations:
  - Agent mode still lags Cursor and Claude Code on multi-step tasks.
  - Output quality varies noticeably between the models in its picker.
  - Chat, agent, CLI, and cloud agent all draw GitHub AI Credits on paid plans.
  - Billing moved to AI Credits (2026-06); autocomplete unlimited on paid.
receipts:
  - https://github.com/features/copilot/plans
  - https://docs.github.com/en/copilot
affiliate: none
evidence_tier: source-verified
momentum: steady
featured: false
data_sensitivity:
  trains_on_inputs: yes
  local_processing: false
last_verified: "2026-08-24"
observed_by: whysanesanders
