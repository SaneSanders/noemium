verdict: ship
verdict_text: >-
  The zero-friction option if your team already lives on GitHub. Fast
  completions, real PR integration, a free tier that's actually usable, and
  Copilot CLI is on that same seat (not a separate catalog card). Agent
  mode still trails Cursor and Claude Code. Pro+ unlocks third-party
  agents (Claude Code, Codex) inside the GitHub bill.
limitations:
  - Agent mode still lags Cursor and Claude Code on multi-step tasks.
  - Output quality varies noticeably between the models in its picker.
  - Chat, agent, CLI, and cloud agent all draw GitHub AI Credits on paid plans.
  - Billing moved to AI Credits (2026-06); autocomplete unlimited on paid.
