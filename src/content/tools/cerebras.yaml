name: Cerebras
tagline: Ultra-fast inference on wafer-scale AI accelerators with competitive API pricing.
url: https://cerebras.ai
category: models-api
pricing: freemium
price_note: "free trial ($5 credits); self-serve Developer from $10 deposit; Enterprise custom"
free_tier: true
