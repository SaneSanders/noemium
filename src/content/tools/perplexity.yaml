name: Perplexity
tagline: Answer engine with citations — search rebuilt around LLMs.
url: https://www.perplexity.ai
category: data
pricing: freemium
price_note: "free tier; Pro $20/mo, Max $200/mo"
free_tier: true
open_source: false
api: true
self_host: false
models_used:
  - gpt-5-6-terra
  - claude-sonnet-5
  - gemini-3-1-pro-preview
verdict: ship
verdict_text: >-
  Replaced Google for a real share of day-to-day queries: cited answers,
  follow-up context, and model choice on Pro. The receipt-link habit fits the
  catalog mindset.
strengths:
  - Cited answers that replaced Google for a real share of day-to-day queries.
  - "Follow-ups and Pro model choice fit a research habit, not a chatbot toy."
use_for:
  - Everyday questions that should come back with sources.
  - A first research pass before you open the primary docs.
skip_when:
  - Citations that do not support the claim would be dangerous.
  - Complex queries would eat Pro search limits.
  - Publisher-dispute risk is a blocker for how you rely on it.
limitations:
  - Citations occasionally point at sources that do not support the claim.
  - Complex queries eat through Pro search limits.
  - Publisher disputes raise long-term sustainability questions.
  - Comet browser went free for all (2026-03).
receipts:
  - https://www.perplexity.ai
  - https://docs.perplexity.ai/guides/pricing
affiliate: none
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: yes
  local_processing: false
last_verified: "2026-08-24"
observed_by: whysanesanders
