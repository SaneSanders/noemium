verdict: situational
verdict_text: >-
  A genuine open-source Figma alternative with CSS-friendly layout tools and
  dev handoff. The free plan covers small teams generously, and you can
  self-host. Plugin ecosystem and advanced prototyping still trail Figma.
limitations:
  - Plugin and template ecosystem is smaller than Figma's.
  - Advanced prototyping and animation features are more limited.
  - Self-hosting requires infrastructure; the managed free plan has storage caps.
