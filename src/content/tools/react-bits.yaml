name: React Bits
tagline: Copy-paste animated React components for landing pages and interactions.
url: "https://reactbits.dev"
category: design
pricing: free
price_note: "MIT + Commons Clause; source available, free for personal and commercial use"
free_tier: true
open_source: false
api: false
self_host: false
verdict: ship
verdict_text: >-
  A solid source of polished animated components you can copy straight into a
  React project. The motion quality is consistently good, but the license is MIT
  plus a Commons Clause, so check the terms before redistributing.
strengths:
  - Polished animated React components you can paste into a landing page today.
  - Motion quality is consistently good for the copy-paste workflow.
use_for:
  - Landing-page interactions on an existing Tailwind React app.
  - Pick-and-choose motion without adopting a full design system.
skip_when:
  - Commons Clause would block how you redistribute.
  - The project is not on Tailwind.
  - Components need to be accessible without a manual pass.
limitations:
  - Tailwind-first styling assumes your project is already on that stack.
  - Some components need accessibility tweaks out of the box.
  - No organized design system; pick-and-choose only.
receipts:
  - "https://reactbits.dev"
  - "https://github.com/DavidHDev/react-bits"
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
