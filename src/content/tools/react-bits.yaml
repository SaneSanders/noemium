verdict_text: >-
  A solid source of polished animated components you can copy straight into a
  React project. The motion quality is consistently good, but the license is MIT
  plus a Commons Clause, so check the terms before redistributing.
limitations:
  - Tailwind-first styling assumes your project is already on that stack.
  - Some components need accessibility tweaks out of the box.
  - No organized design system; pick-and-choose only.
