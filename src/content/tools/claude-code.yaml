name: Claude Code
tagline: Anthropic's terminal agent that edits, runs and tests code in your repo.
url: https://docs.anthropic.com/en/docs/claude-code
category: coding
pricing: paid
price_note: "included in Claude Pro $20/mo ($17/mo yearly) and all paid plans; shares the plan usage pool; extra usage at API rates"
free_tier: false
open_source: false
api: true
self_host: false
models_used:
  - claude-opus-5
  - claude-sonnet-5
  - claude-haiku-4-5
verdict: ship
verdict_text: >-
  Strong agentic coding, nobody argues with that — multi-file refactors,
  test runs and git workflows hold up. But the API bill on a big repo climbs
  fast, and it rewrites code with a confidence it hasn't always earned. The
  Chinese tools (Kimi, Qwen Code) are catching up at a fraction of the price,
  and that's where things are heading.
strengths:
  - Multi-file refactors, tests, and git workflows that hold up in a real repo.
  - Best-in-class agentic coding on Anthropic models.
  - Lives in the repo — no forked IDE to adopt.
use_for:
  - Terminal-native agents on a Claude seat you already pay for.
  - Large refactors you will still review before merge.
skip_when:
  - Cost-sensitive work on a big repo — the API bill climbs fast.
  - You want a GUI diff viewer.
  - You want the Chinese-price stack (Kimi / Qwen) instead of Anthropic.
limitations:
  - API-billed sessions on large repos escalate in cost fast.
  - Confidently makes sweeping changes; big diffs need human review.
  - No GUI at all — a feature until you want a diff viewer.
  - Usage is shared with claude.ai chat on the same seat.
