verdict: situational
verdict_text: >-
  Best for teams already living in JetBrains IDEs; it understands project
  structure and can run, test, and iterate. Outside the JetBrains ecosystem it
  doesn't exist, and credit-based pricing burns faster than the headline tier
  suggests.
limitations:
  - IDE plugin requires a paid JetBrains IDE; CLI works anywhere with BYOK or subscription.
  - Credit-based pricing burns faster than the tier suggests; heavy use needs AI Ultimate or BYOK CLI.
  - Can be slow on deeply nested enterprise codebases.
