verdict_text: >-
  01.AI is winding down the self-serve Yi API platform. A 2026-08-03 notice
  stopped new signups and top-ups; API calls end 2026-09-03 and balance refunds
  run through 2026-12-03. The open-weight Yi models remain available, but the
  hosted API is no longer a viable choice for new projects.
limitations:
  - "The self-serve API platform is shutting down: new signups/top-ups closed 2026-08-03; API calls stop 2026-09-03."
  - Existing balances can be refunded through 2026-12-03; contact yi@01.ai.
  - The current card is RMB-only and requires Chinese-platform identity verification; the international surface closed in 2024.
  - yi-lightning and yi-vision-v2 are intelligent-routing SKUs; the actual model served may be DeepSeek or Qwen, not Yi.
  - Open-weight Yi models are separate from the hosted API and still free on HuggingFace.
  - The company is pivoting to sales-led enterprise platforms (TrueNorth/Wanzhi); no public pricing for those.
  - "Self-serve API closes 2026-09-03 (announced 2026-08-03): registrations and top-ups stopped, existing calls work until then — enterprise sales only after."
