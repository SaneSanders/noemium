verdict_text: >-
  The most polished visual automation platform around — 2,000+ integrations
  and a scenario editor non-technical people actually ship with. The move from
  operations to credits made monthly costs harder to predict, and busy flows
  get expensive at volume. If you don't need self-hosting or agent nodes, this
  is still the default pick.
limitations:
