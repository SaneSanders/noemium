name: Suno
tagline: Full-song generation — vocals, lyrics, arrangement — from a text prompt.
url: https://suno.com
category: audio
pricing: freemium
price_note: "free tier (10 songs/day, non-commercial); Pro $10/mo, Premier $30/mo"
free_tier: true
open_source: false
api: false
self_host: false
verdict: ship
verdict_text: >-
  Type a prompt, get a full song with vocals in about a minute. Suno is
  the fastest way to mock up demos, background tracks or rough ideas. The
  legal situation around training data is still messy, commercial use
  needs a paid tier, and arrangement control is shallow. If you're just
  prototyping, it's the obvious choice.
strengths:
  - Prompt to a full song with vocals in about a minute.
  - "Fastest mock-up for demos, beds and rough ideas."
use_for:
  - Prototype tracks and placeholder music in a product or film scratch.
  - Non-commercial sketching on the free tier while it still exists.
skip_when:
  - Commercial use under the training-data lawsuits is a legal no.
  - You need mix-level control of arrangement.
  - You depend on free-tier downloads after 2026-09-03.
limitations:
  - Training-data lawsuits keep a legal cloud over commercial use.
  - Commercial rights require a paid tier.
  - Fine control over arrangement and mix is limited.
  - Free tier loses downloads 2026-09-03; paid tiers get download caps; ongoing label lawsuits/licensing deals.
