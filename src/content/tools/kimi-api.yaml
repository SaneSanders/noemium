verdict_text: >-
  The Moonshot token meter, not Kimi Code CLI and not kimi.com chat.
  OpenAI SDK against api.moonshot.ai. K3 is flat $3/$15 with a cheap
  cache hit; coding SKU is K2.7 Code. Rate limits follow cumulative
  top-up. China-hosted — same compliance question as other CN labs.
  Not field-called here.
limitations:
  - "K3 is gated behind a successful top-up (docs: minimum $1); this is not a free playground."
  - Rate limits scale with lifetime recharge, not with a published unlimited Pro seat.
  - Docs currently warn that web_search is being updated — don't build on that tool yet.
  - Separate from Kimi Code membership (~$19–$39) and from the MIT CLI.
