price_note: "Free Space (no commercial use); paid yearly Pro 8,000 AI credits + 1,000 exports/mo, Max 25,000 + 3,000, Ultra 75,000 + 10,000; USD is JS-rendered on the pricing page — confirm in-browser; API/MCP billed separately"
free_tier: true
