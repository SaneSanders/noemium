name: LangGraph
tagline: Graph-based agent orchestration from LangChain — stateful and controllable.
url: https://www.langchain.com/langgraph
category: agents
pricing: freemium
price_note: "framework free open-source; LangSmith Plus $39/seat/mo"
free_tier: true
open_source: true
api: true
self_host: true
model_routing: byok
verdict: ship
verdict_text: >-
  Production agents need explicit state, human checkpoints, and replay —
  LangGraph delivers all three. The learning curve is real, mostly because
  LangChain leaks through the abstractions. Overkill for a simple single-agent
  script; hard to beat once a workflow has to stay observable.
strengths:
  - "Explicit state, human checkpoints and replay — what production agents actually need."
  - Hard to beat once a workflow has to stay observable.
use_for:
  - "Multi-step agents that must pause, resume and be inspected."
  - "Teams already in the LangChain orbit who need a real graph, not a chain demo."
skip_when:
  - The job is a simple single-agent script.
  - You will not climb the LangChain leak-through learning curve.
  - Docs sprawl across the ecosystem is a non-starter.
limitations:
  - Learning curve is real; LangChain abstractions leak through.
  - Docs sprawl across the whole LangChain ecosystem.
  - Overkill for simple single-agent tasks.
  - LangGraph Platform renamed LangSmith Deployment; usage billed in LCU/LSU.
receipts:
  - https://github.com/langchain-ai/langgraph
affiliate: none
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
