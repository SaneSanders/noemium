verdict: situational
verdict_text: >-
  Still the file everyone already has. Make is Figma's AI app builder, sold
  as Full-seat access plus monthly AI credits (3,000 on Professional), not as
  Make.com. Starter credits are a taste. Heavy Make use burns the credit pool
  and then pay-as-you-go. Not a field test of Make output quality.
limitations:
  - Figma Make is Full-seat on paid plans; Dev/Collab seats are not the Make license.
  - AI credits are per seat; unused teammate credits do not cover your overage.
  - Starter AI is 150/day with a 500/mo cap — enough to demo, not to ship.
  - This is not Make.com (Integromat); automations live on that other card.
