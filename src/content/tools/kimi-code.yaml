verdict: ship
verdict_text: >-
  A credible open-source Claude Code alternative. The CLI is free and the
  Anthropic-compatible gateway means it drops into existing toolchains. Costs
  can climb if you lean on hosted inference, so BYOK is the smart setup.
limitations:
  - Pricing story is complicated; "$19 flat" is misleading for heavy users.
  - Newer and less polished ecosystem than Claude Code.
  - Data goes to Moonshot unless self-hosted/BYOK.
  - Multiple regional plans make comparison confusing.
