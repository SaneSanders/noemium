name: Superhuman
tagline: Premium email client with AI triage, drafts and follow-ups.
url: https://www.superhuman.com
category: productivity
pricing: paid
price_note: "no free mail tier; standalone Mail Starter $30/mo ($300/yr) or Business $40/mo ($396/yr); suite Business $33/mo annual ($40/mo) includes Mail"
free_tier: false
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Fast email if you are keyboard-driven and live in Gmail. The drafting is
  fine, but at $30–40/mo it is a luxury now that Gmail and others ship free
  AI. Try it for the speed, not because you need AI mail.
limitations:
  - Expensive while free alternatives catch up.
  - Calendar features thinner than dedicated tools.
  - Muscle-memory lock-in cuts both ways.
  - Mail is bundled only in Business/Enterprise suite tiers; Free/Pro tiers get Grammarly/Docs/Go, not Mail (the company formerly known as Grammarly rebranded as Superhuman in 2025).
