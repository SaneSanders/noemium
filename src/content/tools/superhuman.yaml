name: Superhuman
tagline: Premium email client with AI triage, drafts and follow-ups.
url: https://www.superhuman.com
category: productivity
pricing: freemium
price_note: "freemium suite; Free/Pro tiers cover Grammarly/Docs/Go but not Mail; Mail requires the Business suite: $40 per member/mo monthly or $33/mo billed annually ($396/yr)"
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Fast email if you are keyboard-driven and live in Gmail. The drafting is
  fine, but at $33–40/mo (Business tier, required for Mail) it is a luxury now
  that Gmail and others ship free AI. Try it for the speed, not because you
  need AI mail.
strengths:
  - Keyboard-driven email speed for Gmail power users.
  - Fast drafting and follow-ups.
use_for:
  - Gmail users who live on keyboard shortcuts.
  - Professionals prioritizing email speed over AI novelty.
skip_when:
  - $33–40/mo Business tier for Mail is too expensive.
  - You rely on strong calendar features.
  - Free AI in Gmail meets your drafting needs.
limitations:
  - Expensive while free alternatives catch up.
  - Calendar features thinner than dedicated tools.
  - Muscle-memory lock-in cuts both ways.
  - Mail is bundled only in Business/Enterprise suite tiers; Free/Pro tiers get Grammarly/Docs/Go, not Mail (the company formerly known as Grammarly rebranded as Superhuman in 2025).
