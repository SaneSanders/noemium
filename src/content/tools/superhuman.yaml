verdict_text: >-
  Fast email if you are keyboard-driven and live in Gmail. The drafting is
  fine, but at $25–30/mo it is a luxury now that Gmail and others ship free
  AI. Try it for the speed, not because you need AI mail.
limitations:
  - Expensive while free alternatives catch up.
  - Calendar features thinner than dedicated tools.
  - Muscle-memory lock-in cuts both ways.
  - Grammarly acquired Superhuman and renamed the whole company Superhuman (2025); mail not included in Free/Pro suite tiers.
