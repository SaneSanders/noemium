verdict: situational
verdict_text: >-
  The open Devin-shaped stack: Agent Canvas in the browser, a Python SDK,
  CLI, and sandboxes you can run yourself. Cloud is a hosted SKU, not the
  license. Repos split MIT vs commercial enterprise directories — read the
  LICENSE in the repo you actually deploy. Not field-run here.
limitations:
  - Cloud pricing is in-product; this card will not invent a $20 figure from blogs.
  - Multiple repos (Canvas, SDK, sandbox, automation) — "OpenHands" is a family.
  - You still bring a model; sandbox compute is the other bill.
  - Legacy Local GUI is deprecated; Canvas is the current browser client.
