name: Motion (usemotion)
tagline: AI project manager that auto-schedules tasks into your calendar.
url: https://www.usemotion.com
category: productivity
pricing: paid
price_note: "7-day trial; Pro AI $19/seat/mo yearly (7,500 credits/seat); Business AI $29/seat/mo yearly (15,000 credits/seat)"
free_tier: false
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Auto-scheduling works when your work is a pile of deadline-driven tasks.
  It is opinionated, the setup takes time, and the price adds up fast. Try it
  if your calendar is the problem; skip it if you just want a simple to-do
  list.
strengths:
  - "Auto-schedules deadline-driven tasks directly into your calendar."
  - "Yearly plans include a predictable AI-credit pool per seat."
use_for:
  - "People whose calendar is the bottleneck and tasks are deadline-driven."
  - "Teams with a calendar-centric workflow and budget for a productivity tool."
skip_when:
  - "You just want a simple to-do list without calendar rearrangement."
  - "The price and onboarding overhead outweigh the scheduling benefit."
  - "AI-credit limits would throttle how you plan work."
limitations:
  - Expensive for a personal productivity tool.
  - Requires aggressive onboarding to get value.
  - Notifications can feel like a micromanaging boss.
  - No free tier; AI credits model (7.5k credits/seat on Pro).
receipts:
