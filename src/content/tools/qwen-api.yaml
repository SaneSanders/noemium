verdict: ship
verdict_text: >-
  The widest Chinese model menu in one API, with open weights and a real
  international region. Pricing is attractive, but the console still feels
  built for China-first users, so expect some billing and rate-card friction.
limitations:
  - International vs China pricing diverges; OpenRouter can be cheaper for some models.
  - Large MoE models are expensive to self-host.
  - China-region compliance and billing can be hard for non-China users.
  - Some docs and rate-card pages are JS-rendered or region-locked.
