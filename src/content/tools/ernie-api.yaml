verdict_text: >-
  ERNIE 5.1 ranks high on Chinese leaderboards and the 4.5 Turbo / X1.1 tiers
  are cheap. The practical path is still mainland Baidu Cloud; international
  onboarding is harder and pricing is quoted in CNY.
limitations:
  - Best access path is mainland-China Baidu Cloud; international onboarding is harder.
  - ERNIE 5.1 is closed/API-only, reducing flexibility vs Qwen or DeepSeek.
  - ERNIE 5.1 pricing is tiered by input length (≤32k vs 32k-128k).
  - Pure-text reasoning value is weaker than DeepSeek or Qwen on some benchmarks.
  - ERNIE Lite Pro / Speed Pro are not shown on the current official pricing page.
