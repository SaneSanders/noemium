name: Flowglad
tagline: YC-backed, open-source payments and billing infrastructure with a zero-webhook, source-of-truth approach.
url: https://www.flowglad.com
category: automation
pricing: freemium
price_note: "free tier; Plus $40/mo (annual billing, save $120); Max $400/mo (annual billing, save $1,200); Enterprise from $1,500/mo"
free_tier: true
open_source: true
api: true
self_host: false
verdict: situational
verdict_text: >-
  Worth evaluating if you are building an AI/SaaS app and want billing state as a
  single source of truth without maintaining webhook handlers. The open-source
  billing engine and SDK are promising, but the product is young, the documented
  path is the hosted SaaS, and the pricing table is only on the homepage.
strengths:
  - "Open-source billing engine and SDK with a source-of-truth data model."
  - "Zero-webhook approach reduces the integration surface."
  - "YC-backed with transparent, if homepage-only, pricing tiers."
use_for:
  - "AI/SaaS apps that want billing state managed without custom webhook handlers."
  - "Teams evaluating an open, auditable billing engine alongside a hosted option."
skip_when:
  - "You need mature seat-based billing or wallet features today."
  - "You want a standalone /pricing page rather than a homepage table."
  - "You need Flowglad itself to be the payment processor."
limitations:
  - Young launch; several billing features (seat-based billing, wallets) are still on the roadmap.
  - Pricing details live only on the homepage, not on a standalone /pricing page.
  - The open-source repo is available, but the documented onboarding is the hosted Flowglad service.
  - Plan usage limits (organization credits, spaces, connections, automations) are visible but not defined in detail.
  - You still need a payment-processor relationship; Flowglad is not itself a processor.
receipts:
