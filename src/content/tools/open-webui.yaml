name: Open WebUI
tagline: Self-hosted chat UI for Ollama and OpenAI-compatible APIs — your models, your box.
url: https://openwebui.com
category: dev-infra
pricing: freemium
price_note: "self-host free (pip/docker); Enterprise SSO/RBAC/air-gap is a commercial SKU (talk to sales)"
free_tier: true
open_source: true
api: true
self_host: true
model_routing: byok
verdict: situational
verdict_text: >-
  The default homelab ChatGPT skin: Ollama, OpenAI, Anthropic, RAG, voice,
  a huge community library. The product is the interface, not the model.
  Enterprise exists for SSO and air-gap. Ops (auth, updates, disk) are on
  you. Not a cloud assistant.
strengths:
  - "Self-hosted chat UI that works with Ollama and OpenAI-compatible APIs."
  - "Huge community library of models, tools and prompts."
  - "RAG and voice features out of the box."
use_for:
  - "Homelabs that want a ChatGPT-like skin on local models."
  - "Teams that need an air-gapped or self-hosted chat interface."
  - "Users who already run Ollama and want a richer web UI."
skip_when:
  - "You want a fully managed cloud assistant with zero ops."
  - "You cannot maintain Docker, GPU, backups and auth yourself."
  - "You are self-hosting to avoid cloud APIs but will still plug them in."
limitations:
  - You operate Docker/GPU/backups; this is not a hosted chat product.
  - Feature surface is huge; upgrades can reshuffle the UI (see v0.11 notes).
  - Connecting cloud APIs reintroduces the data-residency question you self-hosted to avoid.
  - Enterprise controls are not the MIT community build.
receipts:
  - https://github.com/open-webui/open-webui
  - https://docs.openwebui.com
affiliate: none
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
