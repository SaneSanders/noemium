verdict: situational
verdict_text: >-
  Vertex AI / Agent Platform is a full-stack shop for teams already on Google Cloud, combining Model Garden, tuning, MLOps, and agent tooling.
  It supports a wide range of Google, third-party, and open models with deep BigQuery and Cloud integrations.
  The platform is powerful but sprawling; pricing has many moving parts, and the recent rebranding creates navigation friction.
limitations:
  - Pricing is fragmented across model inference, compute, storage, pipelines, and management fees.
  - The shift from "Vertex AI" to "Gemini Enterprise Agent Platform" means docs, SKUs, and URLs are in transition.
  - Best value is for GCP-centric teams; multi-cloud or simple API-only users may find it heavyweight.
