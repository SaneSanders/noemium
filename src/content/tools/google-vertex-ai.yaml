name: Google Vertex AI
tagline: "Google Cloud's ML and generative AI platform, now branded Gemini Enterprise Agent Platform."
url: https://cloud.google.com/vertex-ai
category: models-api
pricing: paid
price_note: "Pay-as-you-go for models, compute, storage, and pipelines; new Google Cloud customers get $300 in credits. Agent Platform offers limited free tiers for agent compute, memory, and storage."
free_tier: false
open_source: false
api: true
self_host: false
model_routing: locked
verdict: situational
verdict_text: >-
  Vertex AI / Agent Platform is a full-stack shop for teams already on Google Cloud, combining Model Garden, tuning, MLOps, and agent tooling.
  It supports a wide range of Google, third-party, and open models with deep BigQuery and Cloud integrations.
  The platform is powerful but sprawling; pricing has many moving parts, and the recent rebranding creates navigation friction.
strengths:
  - Full-stack Google Cloud ML and generative AI platform.
  - Supports a wide range of Google, third-party, and open models.
  - Deep BigQuery and Cloud integrations for GCP-centric teams.
use_for:
  - Teams already committed to Google Cloud infrastructure.
  - Workflows that need model garden, tuning, MLOps, and agent tooling together.
skip_when:
  - You are a multi-cloud or simple API-only user who wants a lightweight option.
  - Fragmented pricing across inference, compute, storage, and fees is a blocker.
  - The Vertex-to-Agent-Platform rebrand creates navigation friction you cannot afford.
limitations:
  - Pricing is fragmented across model inference, compute, storage, pipelines, and management fees.
  - The shift from "Vertex AI" to "Gemini Enterprise Agent Platform" means docs, SKUs, and URLs are in transition.
  - Best value is for GCP-centric teams; multi-cloud or simple API-only users may find it heavyweight.
