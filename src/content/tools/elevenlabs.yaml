name: ElevenLabs
tagline: The reference standard for AI voice — TTS, cloning, dubbing and voice agents.
url: https://elevenlabs.io
category: audio
pricing: freemium
price_note: "free tier (10k credits/mo, non-commercial); Starter $6/mo, Creator $22/mo"
free_tier: true
open_source: false
api: true
self_host: false
models_used:
  - eleven-v3
verdict: ship
verdict_text: >-
  Still the reference for AI voice quality, and the API is solid enough to
  build real products on. Voice cloning and multilingual dubbing mostly
  just work. The credit system is confusing, the best models burn through
  credits fast, and Creator doubled in price in 2026. Worth it if you need
  the best voice, but budget carefully.
strengths:
  - "Still the reference for AI voice quality, with an API you can ship on."
  - Cloning and multilingual dubbing mostly just work.
use_for:
  - "Product voice, dubbing, or agents where quality is the bottleneck."
  - A first clone before you commit a production credit budget.
skip_when:
  - You cannot forecast credit burn on the best models.
  - Creator-tier repricing already broke the budget.
  - Cloning consent flows are a deal-breaker even for legitimate use.
limitations:
  - Credit-based pricing makes budgeting confusing.
  - Best voices and models burn credits fast.
  - Cloning consent flows add friction even for legitimate use cases.
  - 2026 repricing — Creator went from $11 to $22 with a bigger quota.
receipts:
