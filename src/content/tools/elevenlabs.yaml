verdict: ship
verdict_text: >-
  Still the reference for AI voice quality, and the API is solid enough to
  build real products on. Voice cloning and multilingual dubbing mostly
  just work. The credit system is confusing, the best models burn through
  credits fast, and Creator doubled in price in 2026. Worth it if you need
  the best voice, but budget carefully.
limitations:
  - Credit-based pricing makes budgeting confusing.
  - Best voices and models burn credits fast.
  - Cloning consent flows add friction even for legitimate use cases.
  - 2026 repricing — Creator went from $11 to $22 with a bigger quota.
