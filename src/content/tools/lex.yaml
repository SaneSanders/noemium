verdict_text: >-
  A clean, focused long-form writing app. Inline prompts and version
  history help if drafting is your main job. Overkill for occasional
  paragraph help, and ChatGPT Canvas covers part of it free.
limitations:
  - A subscription on top of what ChatGPT Canvas partially does free.
  - Far smaller feature set than Notion or Google Docs.
  - Mobile experience is thin.
