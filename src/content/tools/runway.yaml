name: Runway
tagline: The incumbent AI video suite — Gen-4 generation plus a full editing toolchain.
url: https://runway.com
category: video
pricing: freemium
price_note: "free tier (125 one-off credits); Standard $12/mo, Pro $28/mo (yearly)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: ship
verdict_text: >-
  Still the most complete AI video workflow. Gen-4 quality is competitive,
  and the editing tools — inpainting, motion brush, green screen — let you
  finish a shot instead of just generating a clip. Credit math gets painful
  if you iterate heavily, and the best quality modes sit behind pricier tiers.
strengths:
  - "Most complete AI video workflow: generate plus inpainting, motion brush, green screen."
  - "Gen-4 quality is competitive, and you can finish a shot in the same suite."
use_for:
  - "Short-form video that needs edit tools, not just a clip generator."
  - Teams that will pay to iterate inside one vendor.
skip_when:
  - Credit math on heavy iteration would blow the budget.
  - Best quality modes sit behind a tier you will not buy.
  - You need long coherent narrative without manual stitching.
limitations:
  - Credit math gets expensive for iteration-heavy projects.
  - Best quality modes sit behind pricier tiers.
  - Long coherent narratives still need heavy manual stitching.
  - Unlimited tier replaced by Max for new subscribers (2026-06).
