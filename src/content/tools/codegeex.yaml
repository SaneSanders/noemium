name: CodeGeeX
tagline: Free and open-source IDE plugin and coding model family from Zhipu.
url: https://codegeex.cn
category: coding
pricing: free
price_note: "CodeGeeX plugin and model family are free and open source; GLM Coding Plan paid subscription is a separate product from $18/mo"
free_tier: true
open_source: true
api: false
self_host: true
verdict: ship
verdict_text: >-
  A genuinely free, open-source Copilot-style plugin with self-hosting options.
  It will not match Cursor or GitHub Copilot in ecosystem depth, but the price
  and privacy story are hard to beat.
strengths:
  - "Genuinely free, open-source Copilot-style plugin with a self-host path."
  - Price and privacy story are hard to beat even if the ecosystem is thinner.
use_for:
  - Teams that want inline completions without a Copilot invoice.
  - Air-gapped or self-hosted coding assistance on GLM-class models.
skip_when:
  - You need Cursor or Copilot ecosystem depth.
  - Western docs and support are a requirement.
  - Enterprise features that only exist on the paid GLM Coding Plan.
limitations:
  - Ecosystem smaller than Cursor or GitHub Copilot.
  - Western documentation and support are thinner.
  - Model updates and roadmap tied to Zhipu/GLM.
  - Enterprise features live in the separate paid GLM Coding Plan.
