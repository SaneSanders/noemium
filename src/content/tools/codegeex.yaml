verdict_text: >-
  A genuinely free, open-source Copilot-style plugin with self-hosting options.
  It will not match Cursor or GitHub Copilot in ecosystem depth, but the price
  and privacy story are hard to beat.
limitations:
  - Ecosystem smaller than Cursor or GitHub Copilot.
  - Western documentation and support are thinner.
  - Model updates and roadmap tied to Zhipu/GLM.
  - Enterprise features live in the separate paid GLM Coding Plan.
