name: Inngest
tagline: Durable workflows and event-driven functions for serverless apps.
url: https://www.inngest.com
category: dev-infra
pricing: freemium
price_note: "free Hobby tier; Pro $99/mo"
free_tier: true
open_source: false
api: true
self_host: true
verdict: ship
verdict_text: >-
  Makes "sleep for a week then continue" easy in serverless functions. Great
  for AI pipelines that need human approval or multi-step state. Self-hosting
  is not the primary path, so heavy compliance needs require evaluation.
strengths:
  - Makes sleep-for-a-week-then-continue easy in serverless functions.
  - Fits AI pipelines that need human approval or multi-step state.
use_for:
  - Event-driven TypeScript or Python jobs with durable steps.
  - Agent pipelines that pause for a human and resume later.
skip_when:
  - "You need an OSI license today, not SSPL with a delayed conversion."
  - "Self-hosting has to match Trigger.dev's story."
  - The team is not on TypeScript or Python.
limitations:
  - The server and CLI use SSPL with delayed Apache-2.0 conversion, not an OSI open-source license today.
  - Self-hosting story is lighter than Trigger.dev.
  - Language SDKs are mostly TypeScript/Python.
  - Event modeling requires upfront design.
receipts:
  - https://github.com/inngest/inngest
  - https://www.inngest.com/pricing
affiliate: none
evidence_tier: source-verified
momentum: steady
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
