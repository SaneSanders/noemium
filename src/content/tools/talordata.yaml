verdict_text: >-
  Fast structured SERP data without proxy or CAPTCHA management — clean JSON
  from four major engines at a flat rate. Best fit when an agent or RAG
  pipeline needs raw search results; it returns ranked results, not
  synthesized research summaries like Tavily-style APIs.
limitations:
