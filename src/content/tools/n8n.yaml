name: n8n
tagline: Source-available workflow automation with strong AI agent nodes.
url: https://n8n.io
category: automation
pricing: freemium
price_note: "self-host free; cloud Starter €24/mo (€20/mo billed yearly)"
free_tier: true
open_source: false
api: true
self_host: true
verdict: ship
verdict_text: >-
  Visual workflows with real AI agent nodes, plus you can self-host. That's a
  rare mix of approachable and controllable. Fair-code, not fully open source,
  and big workflows get messy to debug. Still the strongest Zapier alternative
  once AI steps enter the picture.
strengths:
  - "Visual workflows with real AI agent nodes, and you can self-host."
  - Strongest Zapier-class alternative once AI steps enter the picture.
use_for:
  - "Self-hosted automations that need agent nodes, not just HTTP."
  - Ops teams that outgrew Make and want the workflows on their metal.
skip_when:
  - Fair-code licensing blocks the way you would resell it.
  - Big workflows are already painful to debug.
  - Cloud per-execution pricing would sting at your volume.
limitations:
  - Fair-code license, not true open source for resale.
  - Error handling in big workflows gets messy.
  - Cloud per-execution pricing stings at volume.
receipts:
  - https://github.com/n8n-io/n8n
affiliate: none
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
