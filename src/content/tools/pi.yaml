name: Pi
tagline: Minimal open-source coding-agent harness — TUI, SDK, RPC, BYOK, customize instead of feature-bloat.
url: https://pi.dev
category: coding
pricing: free
price_note: "CLI/SDK free; you pay the model provider; packages install from npm or git"
free_tier: true
open_source: true
api: true
self_host: true
model_routing: byok
verdict: situational
verdict_text: >-
  Mario Zechner's harness: small prompt, tree-structured sessions, 15+
  providers, and a bias toward "build the feature as an extension" instead of
  shipping MCP/subagents/plan mode. Powerful if you like assembling; empty
  if you wanted Cursor. Not a Ship without using it on a repo.
strengths:
  - Minimal open-source harness with TUI, SDK, and RPC in one repo.
  - Supports 15+ providers and is built for extension over feature-bloat.
  - Free CLI/SDK; you only pay the model provider you authenticate.
use_for:
  - Developers who want to assemble and customize their own coding agent.
  - Terminal-first workflows comfortable with git/npm and BYOK setup.
skip_when:
  - You want bundled MCP, sub-agents, or permission UI out of the box.
  - You need polished GUI docs and a guided onboarding experience.
  - You are not willing to bring and manage your own model keys.
limitations:
  - No bundled MCP, sub-agents, or permission UI — by design, you add them.
  - Quality is 100% the model you authenticate.
  - Docs and packages assume comfort with git/npm and a terminal.
  - Not Inflection Pi and not π the number — this is pi.dev / pi-mono.
receipts:
  - https://pi.dev
  - https://github.com/badlogic/pi-mono
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
