verdict: situational
verdict_text: >-
  The tracker teams actually keep using. Agent platform and Linear Agent ship
  on Free; coding sessions are starred as AI-credit extras. Basic/Business are
  yearly-priced on the public page. This is project ops, not an IDE. No
  production workspace run in this pass.
limitations:
  - Free caps at 250 issues and 2 teams.
  - Coding sessions and some agent features consume AI credits on top of the seat.
  - Business/Enterprise features (Asks, Insights, SAML) are not on Basic.
  - Not a substitute for GitHub Issues if the team already lives in PRs only.
