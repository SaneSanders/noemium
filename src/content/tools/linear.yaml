name: Linear
tagline: Issue tracker with a first-party agent platform — issues, cycles, and an agent that can open coding sessions.
url: https://linear.app
category: productivity
pricing: freemium
price_note: "Free $0 (2 teams, 250 issues); Basic $10/user/mo billed yearly; Business $16/user/mo billed yearly; coding sessions spend AI credits"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  The tracker teams actually keep using. Agent platform and Linear Agent ship
  on Free; coding sessions are starred as AI-credit extras. Basic/Business are
  yearly-priced on the public page. This is project ops, not an IDE. No
  production workspace run in this pass.
limitations:
  - Free caps at 250 issues and 2 teams.
  - Coding sessions and some agent features consume AI credits on top of the seat.
  - Business/Enterprise features (Asks, Insights, SAML) are not on Basic.
  - Not a substitute for GitHub Issues if the team already lives in PRs only.
strengths:
  - Issue tracker teams actually keep using.
  - First-party agent platform and Linear Agent ship on the free plan.
  - Coding sessions connect tickets to actual coding work.
use_for:
  - Teams that need issue tracking plus a built-in coding agent.
  - Workflows that combine cycles, issues, and coding sessions.
skip_when:
  - You need more than 250 issues or 2 teams on the free plan.
  - You want coding sessions without buying AI credits on top of the seat.
  - Your team already lives entirely inside GitHub Issues/PRs.
receipts:
  - https://linear.app/pricing
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: false
last_verified: "2026-08-24"
observed_by: whysanesanders
