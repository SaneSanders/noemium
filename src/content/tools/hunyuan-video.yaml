name: Hunyuan Video
tagline: Open-weights text/image-to-video generation model from Tencent.
url: https://github.com/Tencent-Hunyuan/HunyuanVideo
category: video
pricing: paid
price_note: "Open weights, self-host infrastructure cost only; HunyuanVideo-1.5 hosted API ~$0.075/sec (480p) via fal.ai; Hunyuan 3D Rapid ~$0.02/image via Atlas Cloud"
free_tier: true
open_source: true
api: true
self_host: true
verdict: situational
verdict_text: >-
  A surprise open-weights release that can run locally and competes with closed
  video models. The self-hosting cost is real, and the first-party hosted API
  price was not confirmed at scan time.
strengths:
  - Open-weights text/image-to-video model from Tencent.
  - Can run locally and competes with closed video models.
  - Available through third-party hosted APIs when self-hosting is too expensive.
use_for:
  - Local video generation when you control the hardware and data.
  - Experiments where open weights matter more than polish.
skip_when:
  - You need native audio in the generated video.
  - You lack the GPU infrastructure for local inference.
  - You want first-party support and documentation outside China.
limitations:
  - No native audio; visual-only output.
  - Self-hosting still requires serious GPU infrastructure.
  - First-party hosted API is not advertised by Tencent; available through third-party aggregators.
  - Limited consumer app and support outside China.
