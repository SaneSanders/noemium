verdict: situational
verdict_text: >-
  A surprise open-weights release that can run locally and competes with closed
  video models. The self-hosting cost is real, and the first-party hosted API
  price was not confirmed at scan time.
limitations:
  - No native audio; visual-only output.
  - Self-hosting still requires serious GPU infrastructure.
  - First-party hosted API is not advertised by Tencent; available through third-party aggregators.
  - Limited consumer app and support outside China.
