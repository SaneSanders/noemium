name: Type
tagline: AI-first collaborative writing app for notes, documents, and workflows.
url: https://type.ai
category: writing
pricing: freemium
price_note: "free tier; Pro from $8/mo"
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  A clean, fast writing surface with inline AI that stays out of the way.
  Good for drafting and rewriting, but lacks the depth of Notion for databases
  or the publishing features of dedicated tools.
limitations:
  - Feature set is narrower than Notion/Obsidian.
  - Offline support is limited.
  - Collaboration features lag Google Docs.
strengths:
  - Clean, fast writing surface with inline AI that stays out of the way.
  - Good for drafting and rewriting without tool overload.
use_for:
  - Writers who want a minimal AI drafting surface, not a full workspace.
  - Quick rewriting and note-taking when database features don't matter.
skip_when:
  - You need Notion-style databases or deep workspace features.
  - Offline availability or Google Docs-grade collaboration is required.
  - Publishing features are part of your workflow.
