verdict_text: >-
  The fastest editor you will ever use, and the agent panel is honest
  engineering, not a skin. Best if you want open source plus bring-your-own-key;
  still rougher than Cursor for heavy agent sessions.
limitations:
  - Plugin ecosystem far smaller than any VS Code fork.
  - Hosted AI features moved behind accounts and paid tiers over time.
  - Windows support historically lags macOS/Linux.
