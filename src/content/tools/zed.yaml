name: Zed
tagline: Fast open-source editor (Rust) with a built-in AI panel and agent mode.
url: https://zed.dev
category: coding
pricing: freemium
price_note: "editor free; Pro $10/mo includes $5 token credits, overage at API list price +10%; Business $30/seat/mo; BYOK free"
free_tier: true
open_source: true
api: false
self_host: true
models_used:
  - claude-sonnet-5
model_routing: byok
verdict: situational
verdict_text: >-
  Probably the fastest editor around, and the agent panel is honest
  engineering, not a skin. Bring your own key, point it at any provider —
  including the cheap Chinese ones — and it gets interesting. Still rougher
  than Cursor for heavy agent sessions.
strengths:
  - "Probably the fastest editor around, built in Rust."
  - "Honest engineering in the AI panel, not a thin skin."
  - "Bring your own key to any provider, including cheaper Chinese APIs."
use_for:
  - "Developers who want speed and a native-feeling editor."
  - "Users who prefer BYOK and transparent model choice."
  - "Teams comfortable with a smaller but growing plugin ecosystem."
skip_when:
  - "You depend on the full VS Code extension marketplace."
  - "You need the most polished heavy-agent experience today."
  - "Windows parity is a hard requirement right now."
limitations:
  - Plugin ecosystem far smaller than any VS Code fork.
  - Hosted AI features moved behind accounts and paid tiers over time.
  - Windows support historically lags macOS/Linux.
receipts:
  - https://zed.dev/pricing
  - https://github.com/zed-industries/zed
affiliate: none
momentum: blueshift
featured: false
evidence_tier: source-verified
data_sensitivity:
