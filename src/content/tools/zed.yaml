name: Zed
tagline: Fast open-source editor (Rust) with a built-in AI panel and agent mode.
url: https://zed.dev
category: coding
pricing: freemium
price_note: "editor free; Pro $10/mo includes $5 token credits, overage at API list price +10%; Business $30/seat/mo; BYOK free"
free_tier: true
open_source: true
api: false
self_host: true
models_used:
  - claude-sonnet-5
model_routing: byok
verdict: situational
verdict_text: >-
  Probably the fastest editor around, and the agent panel is honest
  engineering, not a skin. Bring your own key, point it at any provider —
  including the cheap Chinese ones — and it gets interesting. Still rougher
  than Cursor for heavy agent sessions.
limitations:
  - Plugin ecosystem far smaller than any VS Code fork.
  - Hosted AI features moved behind accounts and paid tiers over time.
  - Windows support historically lags macOS/Linux.
