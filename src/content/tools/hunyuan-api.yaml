verdict: situational
verdict_text: >-
  TurboS and T1 are among the cheapest capable LLM APIs, and Hunyuan Video is
  a real open-weights release. Access is the pain point: Tencent Cloud assumes
  a mainland account and some endpoints are geo-blocked in the EU, UK and
  South Korea.
limitations:
  - Access outside China is difficult; Tencent Cloud console assumes mainland account.
  - Some Hunyuan products are geo-blocked in the EU/UK/South Korea.
  - Text reasoning quality is mid-pack, not frontier.
  - Billing across text, image, video and 3D APIs is fragmented.
