name: Hunyuan API
tagline: Tencent Cloud TokenHub API for Hunyuan Hy3 reasoning, plus image, video and 3D generation models.
url: https://cloud.tencent.com/product/hunyuan
category: models-api
pricing: paid
price_note: "Hy3 ~$0.14/$0.56 per 1M tokens (256K context) on TokenHub; Hunyuan 3D from $0.02/image; older TurboS/T1 and HY2.0 lines retired June 2026"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Hy3 is the current Hunyuan API flagship: cheap, Apache 2.0 open weights, and
  sold through Tencent TokenHub. TurboS, T1 and the older HY2.0 line were
  retired in June 2026. Access is still China-account-centric and partly
  geo-blocked, so most international developers will use third-party routers.
limitations:
  - The hosted API is proprietary; Hy3 weights are released under Apache 2.0 and can be run separately.
  - New Hunyuan API capabilities are on TokenHub; the old 混元大模型 platform stops new purchases and shuts down 2026-09-30.
  - TurboS, T1 and the older HY2.0 models were retired in June 2026; do not build new integrations on them.
  - Access outside China is difficult; real-name verification is required and some endpoints are geo-blocked in the EU/UK/South Korea.
  - Text, image, video and 3D billing are split across separate TokenHub model endpoints.
