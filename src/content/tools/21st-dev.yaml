name: 21st.dev
tagline: Component marketplace and registry for React and modern stacks.
url: "https://21st.dev"
category: design
pricing: freemium
price_note: free tier (browse + 2 component copies/day); Builder $6/mo yearly, Builder + AI $15/mo yearly, Team $7.50/seat/mo yearly
free_tier: true
open_source: true
api: false
self_host: false
verdict: situational
verdict_text: >-
  A registry for installing community React components with one command. The
  open-source collection is handy for discovery, but quality and maintenance
  vary, so treat any block as vet-before-ship.
strengths:
  - "Open-source registry with one-command install for community React components."
  - "Useful for discovering pre-built blocks and accelerating early prototypes."
use_for:
  - "Teams that want to browse and install community components quickly."
  - "Prototyping when you can accept community-driven quality."
skip_when:
  - "You need production-ready components without manual vetting."
  - "Discovery noise outweighs the time saved."
  - "The blocks you want sit behind the paid Builder/AI tiers."
limitations:
  - Component quality and maintenance vary widely.
  - Discovery can feel noisy as the catalog grows.
  - Some useful blocks are gated behind pro plans.
receipts:
