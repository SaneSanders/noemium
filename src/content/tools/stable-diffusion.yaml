name: Stable Diffusion (Stability AI)
tagline: The open-weights classic — the largest community ecosystem of checkpoints and tools.
url: https://stability.ai
category: image
pricing: freemium
price_note: "open weights free; Brand Studio Core $50/mo; API from ~$0.03/image"
free_tier: true
open_source: true
api: true
self_host: true
verdict: situational
verdict_text: >-
  The value is the ecosystem — ControlNet, LoRAs, ComfyUI, thousands of
  community checkpoints. Base SDXL/SD3 quality lags behind FLUX now, but
  for custom pipelines and tutorials it still has the deepest bench.
strengths:
  - The open-weights ecosystem gives you ControlNet, LoRAs, ComfyUI and thousands of checkpoints.
  - You can self-host pipelines and avoid per-image API metering.
  - Community tutorials and custom workflows are the deepest in the image category.
use_for:
  - Building custom image pipelines where you need full control over the stack.
  - Self-hosted workflows that should not send assets to a third-party API.
  - Tutorials and experiments that rely on the largest community checkpoint library.
skip_when:
  - You want the best base-model quality out of the box; FLUX currently leads.
  - You cannot spend time picking and tuning the right community checkpoint.
  - Vendor roadmap stability matters more than ecosystem breadth.
limitations:
  - Base models aging against FLUX and newer rivals.
  - Company turbulence eroded trust in the roadmap.
  - Good results require picking the right community checkpoint, not the raw model.
receipts:
  - https://github.com/Stability-AI/generative-models
affiliate: none
evidence_tier: source-verified
momentum: steady
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
