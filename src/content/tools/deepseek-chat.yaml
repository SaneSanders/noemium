verdict_text: >-
  The chat surface for DeepSeek's models. Bot fetches to chat.deepseek.com
  403; the app is still the canonical URL. This is not the API rate card.
  China hosting and topic filters apply. Compare with ChatGPT/Claude on this
  shelf. No logged-in session in this pass.
limitations:
  - chat.deepseek.com is aggressive toward bots (403); humans still use the app.
  - Data residency is a compliance blocker for many orgs (same as the API card).
  - Censorship on some topics is baked in.
  - Do not confuse free chat with the paid, peak/off-peak API.
