name: Relume
tagline: Webflow site builder and component library for marketing websites.
url: "https://relume.io"
category: design
pricing: freemium
price_note: free library browse; paid plans for site builder
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Strong for agencies building Webflow sites at speed. The component library is large, but the value drops if you are not in the Webflow ecosystem.
strengths:
  - Large component library purpose-built for Webflow marketing sites.
  - Free library browse lets you inspect components before paying.
  - Speeds up agency builds when the stack is already Webflow.
use_for:
  - Agencies building Webflow marketing sites at speed.
  - Teams already committed to the Webflow ecosystem.
skip_when:
  - You are not using Webflow; export to other stacks is limited.
  - You need real site-building features without a paid plan.
  - You cannot invest in custom work to avoid samey templates.
limitations:
  - Best inside Webflow; export to other stacks is limited.
  - Paid plans are required for real site building.
  - Designs can look samey without custom work.
receipts:
  - "https://relume.io"
  - "https://relume.io/pricing"
affiliate: none
evidence_tier: source-verified
momentum: steady
featured: false
