verdict: situational
verdict_text: >-
  Reliable GPU cloud with competitive pricing for training and inference.
  Good for teams that need dedicated hardware without hyperscaler complexity.
  The API product is newer and less mature than compute instances.
strengths:
  - Reliable GPU cloud with competitive pricing for training and inference.
  - Dedicated hardware without hyperscaler complexity and lock-in.
use_for:
  - Teams that need dedicated GPU instances for training or inference.
  - Workloads where predictable hardware beats serverless token pricing.
skip_when:
  - You need a mature managed API rather than raw compute instances.
  - Your team lacks the capacity to plan reserved capacity and ops.
  - AWS/GCP-level support and tooling are non-negotiable.
limitations:
  - API service is newer than the GPU cloud.
  - Support and tooling lag AWS/GCP.
  - Pricing for reserved capacity requires planning.
