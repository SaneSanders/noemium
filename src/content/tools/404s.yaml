name: 404s
tagline: Gallery of creative 404 error page designs.
url: "https://404s.design"
category: design
pricing: free
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Browse this when you need a 404 that does not look like a dead end. It is a
  mood board, not a component library: copy the idea, then rebuild it yourself.
strengths:
  - Free gallery of 404 designs for projects that need a better error page.
  - Useful starting point when you want inspiration before building it yourself.
use_for:
  - Finding a visual direction for a 404 before writing any code.
  - Quick inspiration when the default error page feels like an afterthought.
skip_when:
  - You need a drop-in component or exported code for the 404 page.
  - The project needs design assets beyond a single error page.
limitations:
  - No code export.
  - Niche scope; only useful once per project.
  - Curation quality varies.
