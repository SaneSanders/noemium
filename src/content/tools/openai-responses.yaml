name: OpenAI Responses API
tagline: OpenAI's agent-building API — tools, web search and file search built in.
url: https://platform.openai.com/docs/api-reference/responses
category: agents
pricing: paid
price_note: "pay-per-token; e.g. GPT-5.6 Luna $0.20/1M input"
free_tier: false
open_source: false
api: true
self_host: false
models_used:
  - gpt-5-6-terra
  - gpt-5-4-mini
  - gpt-5-6-sol
  - gpt-5-6-luna
model_routing: locked
verdict: ship
verdict_text: >-
  Hosted web search, file search, and code interpreter without building
  plumbing — the most batteries-included agent API. Conversation state lives on
  OpenAI's side, which keeps things simple until it doesn't. A sensible default
  if you want an agent running today instead of wiring your own graph.
strengths:
  - "Batteries-included agent API: hosted web search, file search and code interpreter."
  - "Sensible default when you want an agent running today, not a graph framework."
use_for:
  - New OpenAI agent projects after the Assistants sunset.
  - Prototypes that should use hosted tools instead of your own retrieval.
skip_when:
  - Hosted-tool storage and search pricing would sneak up.
  - "Conversation state cannot live on OpenAI's side."
  - You need LangGraph-level control of the graph.
limitations:
  - Hosted-tool pricing (storage, search calls) sneaks up on you.
  - Conversation state lives on OpenAI's side.
  - Less controllable than explicit-graph frameworks like LangGraph.
  - Assistants API sunsets 2026-08-26 — Responses is the default for new projects.
receipts:
