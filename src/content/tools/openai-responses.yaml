verdict_text: >-
  The most batteries-included agent API: hosted web search, file search and
  code interpreter without wiring infra. The Assistants API is deprecated in
  its favor — build here.
limitations:
  - Hosted-tool pricing (storage, search calls) sneaks up on you.
  - Conversation state lives on OpenAI's side.
  - Less controllable than explicit-graph frameworks like LangGraph.
