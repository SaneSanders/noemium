name: Mem
tagline: AI notes and knowledge base that organizes itself from your captures.
url: https://get.mem.ai
category: productivity
pricing: freemium
price_note: "free tier; paid from $9/mo"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Fast capture with AI search and automatic tagging. Good for people who want
  a second brain without manual organization. The graph view and exports are
  weaker than Obsidian or Notion.
strengths:
  - "Fast capture with AI search and automatic tagging."
  - "Low-friction second brain for people who avoid manual organization."
use_for:
  - "Personal note capture when search and auto-tags matter more than structure."
  - "Quick retrieval from a messy stream of ideas and clips."
skip_when:
  - "You need robust export options or a graph view like Obsidian."
  - "AI tagging miscategorizing messy notes would be costly to fix."
  - "Structured project management is the main job."
limitations:
  - Export options are limited.
  - The AI tagging can miscategorize messy notes.
  - Less flexible for structured project management.
receipts:
  - https://get.mem.ai/pricing
  - https://docs.mem.ai/
affiliate: none
momentum: steady
featured: false
