name: Motion
tagline: "JavaScript and React animation library, formerly Framer Motion."
url: "https://motion.dev"
category: design
pricing: free
price_note: MIT open source
free_tier: true
open_source: true
api: false
self_host: false
verdict: ship
verdict_text: >-
  The default choice for React animations for good reason. The API is expressive, the performance is solid, and the new Motion One variant covers vanilla JS projects too.
strengths:
  - "Default React animation library: expressive API, solid performance."
  - Motion One covers vanilla JS when the project is not React.
use_for:
  - Product UI motion in React.
  - A shared animation layer across React and a little vanilla JS.
skip_when:
  - Importing the whole library would bloat the bundle.
  - Layout animations hit known edge cases in your UI.
  - You are still lost in the Framer Motion rebrand docs.
limitations:
  - Bundle size can add up if you import everything.
  - Layout animations still have edge cases.
  - The rebrand from Framer Motion created some documentation churn.
receipts:
  - "https://motion.dev"
  - "https://github.com/motiondivision/motion"
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
data_sensitivity:
  trains_on_inputs: unknown
  local_processing: true
last_verified: "2026-08-19"
observed_by: whysanesanders
