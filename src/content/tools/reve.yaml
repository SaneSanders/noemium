name: Reve
tagline: 4K image model with layout-native edit/create — consumer energy plans plus a credit API.
url: https://reve.art
category: image
pricing: freemium
price_note: "Free with daily energy; Lite $7.99/mo (5× energy); Pro $19.99/mo (100× energy, video energy); API from $10 = 7,500 credits"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Layout-aware image tool (create/edit/remix, annotations, live layers), not
  a Midjourney clone. Consumer math is energy, not seats: Lite $7.99, Pro
  $19.99 on Reve's help center. API is a second wallet in the console. Video
  energy exists on every plan with different limits (Free one-time allowance,
  Pro 250/mo). Untested on production brand work.
limitations:
  - '"Energy" is opaque versus a per-image rate card; Lite/Pro multiply Free, they don''t publish a raw count here.'
  - API pricing lives in the console, not a public HTML table.
  - Training opt-out is Lite/Pro; Free is default opt-in.
  - Video is not a Pro-exclusive feature; energy limits differ by plan.
strengths:
  - Layout-native image creation and editing with annotations and live layers.
  - Clear consumer plans at $7.99/$19.99 with published energy multiples.
  - A credit API for developers who want programmatic access.
use_for:
  - Designers and creators who want layout-aware image editing, not prompt roulette.
  - Consumers comfortable with energy-based plans for image and video work.
  - Developers who need a credit API alongside the consumer editor.
skip_when:
  - You need a transparent per-image rate card instead of "energy".
  - You want public API pricing outside the console.
  - You object to default opt-in model training on the free plan.
  - Video output matters and the energy limits don't fit your volume.
receipts:
  - https://help.reve.com/hc/en-us/articles/46732445465108-Subscription-plans-overview
  - https://help.reve.com/hc/en-us/articles/46837930295316-Reve-API
  - https://help.reve.com/hc/en-us/articles/46731721501972-Model-training
affiliate: none
evidence_tier: source-verified
momentum: blueshift
featured: false
