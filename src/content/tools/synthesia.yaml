verdict: ship
verdict_text: >-
  The default for templated talking-head video at scale. Avatars are
  presentation-ready, translations are decent, and the editor is genuinely
  usable by non-editors. Emotional range and gestural nuance still feel canned.
limitations:
  - Avatar expressiveness is limited compared to real presenters.
  - Pricing jumps quickly for multiple videos or custom avatars.
  - Output can feel samey if not carefully scripted.
