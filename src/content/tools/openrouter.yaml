verdict: ship
verdict_text: >-
  Small teams get a lot of mileage out of this. Change one string to swap
  models, see all costs on one bill, get fallbacks when a provider flakes. You
  pay a small markup for the convenience, but it saves you from wiring a dozen
  APIs yourself.
limitations:
  - Small markup over direct API pricing.
  - Adds a network hop and latency.
  - Provider-specific features arrive later than direct APIs.
