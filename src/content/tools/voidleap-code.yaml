name: Voidleap Code
tagline: Local-first agentic IDE with your own keys, per-turn model switching, and full observability.
url: https://voidleap.com/
category: coding
pricing: freemium
price_note: "Free: 3 workspaces, 3 projects each, 1 key profile, 7-day history; Pro €20/seat/mo; Team €50/seat/mo"
free_tier: true
open_source: false
api: false
