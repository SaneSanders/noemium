# Example/template for a tool entry. Copy this file, rename to a kebab-case
# slug, fill in from real usage, then run `npm run validate`.
name: Cursor
tagline: AI-first code editor (VS Code fork) with agent mode and inline edits.
url: https://cursor.com
category: coding
pricing: freemium
price_note: "Hobby free; Individual Pro from $20/mo; Teams from $40/user/mo; Ultra and Pro+ are higher Individual meters"
free_tier: true
open_source: false
api: false
self_host: false
models_used:
  - claude-sonnet-5
verdict: ship
verdict_text: >-
  Still the default AI editor, and for a reason: agent mode and tab
  completions genuinely save hours. The model routing is a black box — you
  never quite know what you're talking to — but on Sonnet-class models the
  output is consistently good.
test_run:
  date: "2026-08-24"
  actor: person
  scenarios:
    - "Multi-file agent run across a TypeScript repo: asked it to add a feature, reviewed every diff."
    - "Tab completion on a familiar codebase for a full afternoon."
    - "Large refactor (rename + move + type fixes) on ~40 files with follow-up review."
  artifacts:
    - https://github.com/getcursor/cursor
    - https://forum.cursor.com/
  not_tested:
    - Background agents and scheduled commands.
    - Team/enterprise permissions and shared context rules.
  duration_minutes: 120
strengths:
  - Agent mode and tab completions that actually save hours on everyday edits.
  - "Default AI editor for a reason: Sonnet-class output is consistently good."
  - Fast to start if you already live in a VS Code layout.
use_for:
  - Daily product coding where you want an IDE, not a terminal ritual.
  - Multi-file agent runs when you can sit with the diff.
skip_when:
  - You need to audit or self-host the editor.
  - Heavy agent months where Pro token limits cut you off mid-sprint.
  - You refuse black-box model routing.
limitations:
  - Pro plan token limits throttle heavy agent sessions mid-month.
  - Closed source; no way to self-host or audit data handling.
  - Occasional context-window degradation on very large repos.
receipts:
  - https://cursor.com/pricing
  - https://cursor.com/docs
affiliate: none
momentum: blueshift
featured: true
last_verified: "2026-08-19"
observed_by: whysanesanders
