name: Fathom
tagline: AI meeting recorder — unlimited free capture for individuals, paid team CRM/coaching layers.
url: https://fathom.video
category: productivity
pricing: freemium
price_note: "individual Free $0 (unlimited recordings/summaries); Premium $20/mo ($16 billed yearly); Team $19/user/mo ($15 yearly, 2-user min)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  One of the few meeting tools whose free individual tier is actually
  unlimited recordings, not a three-call tease. Paid is for action items,
  Ask Fathom, CRM sync, coaching. Bot vs bot-free capture is a preference
  and a security review. Not a Gong replacement on Free.
strengths:
  - Free individual tier has unlimited recordings, not a teaser limit.
  - "Clean split: free for capture, paid for action items/CRM/coaching."
  - Bot-free capture option on Mac beta.
use_for:
  - Individual users who want unlimited meeting recordings.
  - Small teams upgrading for CRM sync or coaching scorecards.
  - Mac users who prefer bot-free capture.
skip_when:
  - You need action items or team search on the free tier.
  - Your team is smaller than the 2-user Business minimum.
  - You expect a full Gong replacement on Free.
limitations:
  - Free individual omits advanced summaries, action items, and team search.
  - Team/Business have a 2-user minimum.
  - CRM field sync and coaching scorecards are Business, not Premium.
  - Bot-in-meeting vs bot-free (Mac beta) is a policy choice, not a quality guarantee.
