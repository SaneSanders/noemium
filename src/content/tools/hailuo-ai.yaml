name: Hailuo AI
tagline: MiniMax consumer video generator ranked high on physics and motion realism, available via API resellers.
url: https://hailuoai.com
category: video
pricing: freemium
price_note: "Consumer plans from ¥105/mo (promo ¥55) to ¥1399/mo, credit-based; API via third-party resellers only; no first-party public price card"
free_tier: true
open_source: false
api: true
self_host: false
verdict: situational
verdict_text: >-
  Top-tier physics and motion realism for the price, usually undercutting
  Runway. The free tier is a solid way to test Hailuo 01/02/H3 before committing
  to the ¥105–¥1399 credit plans. For developers, the absence of a public
  first-party video API price means Western access typically routes through
  resellers.
strengths:
  - Strong physics and motion realism in generated video.
  - Usually cheaper than Runway for comparable output quality.
  - Free tier lets you test the Hailuo 01/02/H3 model stack before paying.
  - Credit-based plans from ¥105/mo up to ¥1399/mo for heavy use.
use_for:
  - Short video clips where realistic physics and motion matter most.
  - Budget-conscious creators comparing against Runway pricing.
  - Quick experiments on the free tier before buying credits.
skip_when:
  - You need a published first-party video API price card.
  - Strict content moderation would block your subject matter.
  - You want a single simple credit system across multiple model tiers.
limitations:
  - First-party API pricing not public; Western access usually via resellers.
  - Strict content moderation.
  - Multiple model tiers (Hailuo 01/02/H3) make the credit system harder to navigate.
  - Consumer pricing and API pricing are separate, confusing buckets.
