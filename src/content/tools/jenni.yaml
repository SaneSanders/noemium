verdict: situational
verdict_text: >-
  Purpose-built for students and researchers who need AI autocomplete,
  citation management, and PDF chat in one editor. The free tier is heavily
  capped, and the AI can still hallucinate sources or phrasing. Export and
  formatting work best on paid plans.
limitations:
  - Free plan limits daily AI autocomplete, edits, chat, and PDF uploads.
  - Citation and source suggestions still need manual verification.
  - Less flexible than a general word processor for non-academic formats.
