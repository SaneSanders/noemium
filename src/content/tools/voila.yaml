name: Voila
tagline: Cross-platform AI assistant — chat, writing and automation from any tab or app.
url: https://www.getvoila.ai
category: productivity
pricing: freemium
price_note: free tier; Premium $10/mo ($8 yearly, 3k requests/mo); Ultimate $20/mo ($16 yearly, unlimited)
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  A friendly-priced assistant that genuinely runs everywhere — browser, desktop
  and mobile. Premium at $8/mo billed yearly is one of the cheaper honest
  entry points in this category. The catch is tier gating: Premium locks you
  to the Auto model with a request cap, and model choice only arrives with
  Ultimate. Solid as one convenient assistant; power users will hit the
  ceiling.
strengths:
  - Cross-platform assistant running in browser, desktop, and mobile.
  - Premium at $8/mo yearly is a cheap honest entry point.
  - Ultimate tier unlocks model choice.
use_for:
  - Users who want one convenient assistant across every device.
  - Budget buyers who can live with the Auto model and 3k request cap.
skip_when:
  - You need model choice below the Ultimate tier.
  - 3,000 requests per month would cap a Premium workflow.
  - You are a power user who wants full control over the underlying model.
limitations:
  - Premium is limited to the Auto model — no model choice on that tier.
  - Premium caps at 3,000 requests per month.
receipts:
