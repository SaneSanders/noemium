verdict: situational
verdict_text: >-
  Seed 2.1 Pro is a frontier-class model at aggressive prices, backed by
  ByteDance's infrastructure. For Western users the access path is murky: no
  official USD rate card, mostly Chinese docs, and signup through Volcano
  Engine or BytePlus.
strengths:
  - Seed 2.1 Pro prices undercut frontier Western APIs on a conversion basis.
  - Backed by ByteDance's own infrastructure and model family.
  - Doubao Pro 32K is even cheaper for long-context work.
use_for:
  - Cost-sensitive workloads where CNY pricing and Volcano Engine setup are acceptable.
  - Chinese-market applications that already use ByteDance cloud services.
skip_when:
  - You need an official USD rate card or English-first documentation.
  - EU/US data sovereignty or ByteDance trust is a procurement blocker.
  - You require open-weights or self-hosted fallback.
limitations:
  - Proprietary closed weights — no self-host or open-weights fallback.
  - Access outside China requires Volcano Engine/BytePlus setup; documentation mostly Chinese.
  - USD pricing is approximate; official rate card is CNY-only.
  - EU/US data-sovereignty and trust concerns around ByteDance.
