name: Together AI
tagline: Cloud inference for open models — serverless endpoints and fine-tuning.
url: https://www.together.ai
category: dev-infra
pricing: freemium
price_note: "starter credits; from $0.10/1M tokens (small open models)"
free_tier: true
open_source: false
api: true
self_host: false
models_used:
  - llama-4-maverick
  - qwen3-8-max
  - deepseek-v4-flash
verdict: ship
verdict_text: >-
  Solid uptime, broad catalog, serverless or dedicated endpoints. A safe place
  to move an open-weight prototype into production. Costs at scale push you
  toward dedicated GPUs, and the newest models sometimes land later than on
  specialist hosts.
strengths:
  - "Solid uptime and a broad open-model catalog, serverless or dedicated."
  - Safe place to move an open-weight prototype into production.
use_for:
  - Hosted open models without picking a GPU vendor yet.
  - Fine-tunes that can start on their inference side.
skip_when:
  - Scale already points at dedicated GPU contracts.
  - You need the newest model the day a specialist hosts it.
  - "Fine-tuning UX is the product, not an afterthought."
limitations:
  - Costs at scale push you toward dedicated GPU contracts.
  - Newest models sometimes arrive later than at specialists.
  - Fine-tuning UX less polished than the inference side.
receipts:
