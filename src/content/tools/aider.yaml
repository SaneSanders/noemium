name: Aider
tagline: Open-source pair programming in the terminal — git-native, works with any model.
url: https://aider.chat
category: coding
pricing: free
price_note: "free, open source; bring your own API key"
free_tier: true
open_source: true
api: true
self_host: true
model_routing: byok
verdict: ship
verdict_text: >-
  The terminal purist's agent. No IDE lock-in, automatic commits, and it
  works with almost any model — local ones and the cheap Chinese flagships
  included. Wire up a good model and this beats most paid IDEs for a fraction
  of the cost.
strengths:
  - "Git-native terminal agent: automatic commits, no IDE lock-in."
  - Works with almost any model — local weights and cheap Chinese flagships included.
  - Open source, so the bill is the model, not a seat.
use_for:
  - Pair-programming in the terminal on a repo you already commit to.
  - BYOK setups where you pick the model for the job.
skip_when:
  - You want inline diffs inside an IDE.
  - The model behind it is weak — Aider will not save a bad route.
  - A very large monorepo where the repo-map misses context.
limitations:
  - Terminal-only UI; no inline diff experience.
  - Output quality depends entirely on the model you wire up.
  - Repo-map can miss context in very large monorepos.
receipts:
  - https://github.com/Aider-AI/aider
affiliate: none
momentum: steady
featured: false
last_verified: "2026-08-24"
