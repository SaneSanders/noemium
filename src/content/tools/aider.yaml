verdict: ship
verdict_text: >-
  The purist's agent: no IDE lock-in, automatic commits, and it works with
  almost any model including local ones. If you live in a terminal, this plus a
  good model beats most paid IDEs.
limitations:
  - Terminal-only UI; no inline diff experience.
  - Output quality depends entirely on the model you wire up.
  - Repo-map can miss context in very large monorepos.
