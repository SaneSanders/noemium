name: Aider
tagline: Open-source pair programming in the terminal — git-native, works with any model.
url: https://aider.chat
category: coding
pricing: free
price_note: "free, open source; bring your own API key"
free_tier: true
open_source: true
api: true
self_host: true
verdict: ship
verdict_text: >-
  The terminal purist's agent. No IDE lock-in, automatic commits, and it
  works with almost any model — local ones and the cheap Chinese flagships
  included. Wire up a good model and this beats most paid IDEs for a fraction
  of the cost.
limitations:
  - Terminal-only UI; no inline diff experience.
  - Output quality depends entirely on the model you wire up.
  - Repo-map can miss context in very large monorepos.
