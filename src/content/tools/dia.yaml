name: Dia
tagline: The Browser Company's AI browser — free Chromium shell, paid Answers/Days; macOS Apple Silicon.
url: https://www.diabrowser.com
category: productivity
pricing: freemium
price_note: "Better Browser free; Better Answers $20/mo; Better Days $100/mo; homepage includes a 14-day Better Days trial; macOS 14+ M1+"
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  Arc's successor as an AI browser, now with a public three-rung price
  table. Free is a real browser (profiles, split view, ad/tracker block,
  sync). $20 is page-chat; $100 is Morning Brief / decks / meeting prep.
  /pricing 404s — /plans is the receipt. Windows is still a waitlist
  question. Not Comet, not ChatGPT in Chrome.
strengths:
  - Free tier is a real browser with profiles, split view, ad/tracker block and sync.
  - Clear three-rung pricing table for page-chat and premium AI features.
  - Top tier adds Morning Brief, decks and meeting prep inside the browser.
use_for:
  - macOS 14+ Apple Silicon users who want an AI-native browser replacement.
  - Teams that need page-chat and meeting-prep features inside the browser.
skip_when:
  - You are on Windows or Intel Macs and need a general-availability download today.
  - You need published chat quotas for paid tiers before buying.
  - Default content-sharing toggles must stay off and manual opt-out is not acceptable.
limitations:
  - Public download is macOS 14+ Apple Silicon; Windows is not a general GA claim on the homepage.
  - Usage limits apply on paid tiers; the table does not publish chat quotas as numbers.
  - Default content-sharing to improve Dia is on unless you turn it off in Settings > Privacy.
  - Atlassian ownership is a procurement fact, not a feature list.
receipts:
  - https://www.diabrowser.com/plans
  - https://www.diabrowser.com/privacy
affiliate: none
momentum: blueshift
featured: false
