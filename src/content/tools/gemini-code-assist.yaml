verdict_text: >-
  Strong contextual suggestions inside VS Code and JetBrains, and the free
  individual tier is genuinely useful. It lags Cursor and Claude Code on agentic
  workflows, and enterprise rollout can be slow.
limitations:
  - Agent capabilities are narrower than Cursor or Claude Code.
  - Enterprise billing and data handling need Google workspace alignment.
  - Model updates roll out unevenly across IDE plugins.
