name: Fireflies.ai
tagline: Meeting bot that records, transcribes and summarizes across platforms.
url: https://fireflies.ai
category: productivity
pricing: freemium
price_note: "free tier (unlimited transcription, 400 min storage); Pro $10/seat/mo (yearly)"
free_tier: true
open_source: false
api: true
self_host: false
verdict: skip
verdict_text: >-
  Lots of features on paper, but the bot still joins your calls and the
  summaries are no better than cheaper options. For most people, a bot-free
  tool like Granola is the cleaner choice.
strengths:
  - Records, transcribes and summarizes meetings across multiple platforms.
  - Free tier offers unlimited transcription with 400 minutes of storage.
  - Pro plan adds admin controls and CRM integrations for teams.
use_for:
  - Teams that want a meeting bot integrated with their existing call stack.
  - Organizations that need admin controls and CRM sync for sales calls.
skip_when:
  - External meetings where a visible bot joining the call is awkward.
  - You can get comparable summaries from cheaper or bot-free alternatives.
  - A cluttered UI trying to do everything slows down your workflow.
limitations:
  - Bot visibly joins calls — awkward with external meetings.
  - Transcription accuracy is average.
  - Cluttered UI trying to be everything.
