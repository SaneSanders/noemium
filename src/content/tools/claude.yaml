verdict_text: >-
  The cleanest prose and the best long-document workflow of any chat
  assistant; Projects and Artifacts fit real work. Compare it with
  ChatGPT and Gemini on this shelf, not with Grammarly. Claude Code is
  a separate coding card and shares the same usage pool on paid plans.
limitations:
  - Usage caps on Pro hit fast with large context; Code/Cowork draw from the same pool.
  - No image generation.
  - Smaller plugin/integration ecosystem than ChatGPT.
