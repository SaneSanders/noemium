name: Tongyi Lingma
tagline: Free IDE plugin and standalone AI IDE from Alibaba for completion, chat and repo refactoring.
url: https://lingma.aliyun.com
category: coding
pricing: free
price_note: "Completely free for individual developers; enterprise tier custom pricing via Alibaba Cloud"
free_tier: true
open_source: false
api: false
self_host: false
verdict: situational
verdict_text: >-
  A genuinely free Copilot-style plugin with solid Chinese-language support.
  The catch is Alibaba ecosystem lock-in, limited English documentation, and
  weaker agentic depth than Cursor or Claude Code.
strengths:
  - Genuinely free Copilot-style plugin for individual developers.
  - Solid Chinese-language support and a standalone AI IDE option.
  - Backed by Alibaba Cloud for China-account users.
use_for:
  - Individual developers who want free completion and chat inside their IDE.
  - Chinese-speaking teams or projects already on Alibaba Cloud.
skip_when:
  - You need agentic depth comparable to Cursor or Claude Code.
  - English documentation and Western support are required.
  - You cannot accept Alibaba ecosystem lock-in.
  - Transparent enterprise pricing outside China is essential.
limitations:
  - Less powerful than Cursor or Claude Code for agentic tasks.
  - Heavy Alibaba ecosystem lock-in.
  - Limited English documentation and Western support.
  - Enterprise pricing is opaque and China-account oriented.
