verdict_text: >-
  A safe pick for corporate training and slide voiceovers where consistency
  and team licenses matter more than sounding truly human. APIs and
  consumer cloning are not its strength — ElevenLabs is the better fit
  there. Good enough for e-learning, just don't expect a warm, natural
  voice.
limitations:
  - Voices sound more corporate-synthetic than the leaders.
  - Limited voice-cloning flexibility.
  - Editor-centric product; weaker API story.
