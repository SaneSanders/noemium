verdict_text: >-
  Flexible agent orchestration with human-in-the-loop, code execution, and
  group chat patterns. Great for research prototypes and complex reasoning
  chains. The learning curve is steep and debugging multi-agent conversations
  is hard.
limitations:
  - Now in maintenance mode; new users are directed to Microsoft Agent Framework.
  - Steep learning curve compared to CrewAI.
  - Documentation can lag the fast-moving codebase.
  - Production observability requires extra tooling.
