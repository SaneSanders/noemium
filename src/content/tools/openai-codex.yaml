name: OpenAI Codex
tagline: OpenAI's coding agent — terminal CLI, IDE, and cloud tasks, bundled into ChatGPT plans.
url: https://chatgpt.com/codex
category: coding
pricing: freemium
price_note: "included in ChatGPT Free/Go/Plus/Pro; Plus $20/mo, Pro from $100/mo; extra credits after 5h caps; API key billed at API rates"
free_tier: true
open_source: true
api: true
self_host: false
models_used:
  - gpt-5-6-sol
  - gpt-5-6-terra
  - gpt-5-6-luna
model_routing: bundled
verdict: situational
verdict_text: >-
  The CLI on GitHub is real and the ChatGPT bundle makes it the lowest-friction
  OpenAI coding agent. Caps sit on a five-hour window, credits replaced
  per-message billing in Apr 2026, and cloud tasks are Plus-and-up. Not a
  second Responses API card — this is the product you run against a repo.
  No field run here, so this is not a Ship stamp.
strengths:
  - Lowest-friction OpenAI coding agent if you already pay for ChatGPT.
  - Real CLI on GitHub plus IDE and cloud tasks on one bundle.
  - Free/Go exist as a trial path; Plus is where cloud GitHub review lives.
use_for:
  - Repo work on an OpenAI seat you already have, not a second Responses API card.
  - Mixed local CLI and cloud tasks inside the ChatGPT plan.
skip_when:
  - You need a predictable session cost — credits and a 5-hour window fight you.
  - The repo cannot leave OpenAI's hosted agent.
  - Multi-step agent work is the job and you can run Cursor or Claude Code instead.
limitations:
  - Local and cloud usage share a rolling 5-hour window; weekly caps also apply.
  - Free/Go are trial-level; cloud GitHub review and plugins sit on Plus+.
  - Token-credit metering (from 2026-04) makes a session's cost hard to predict.
  - Conversation/repo context still leaves OpenAI; no self-host of the hosted agent.
