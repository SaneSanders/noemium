price_note: "CosyVoice 2 from ~$0.287/10,000 characters; CosyVoice 3.5 Plus from ~$0.22/10,000 characters; CosyVoice voice creation free; Qwen-TTS voice creation $0.20/voice; free quota: 10 voice creations in first 90 days (Singapore region)"
free_tier: true
