price_note: "CosyVoice 2 from ~$0.287/10,000 characters; CosyVoice 3.5 Plus from ~$0.22/10,000 characters; CosyVoice voice creation free; Qwen-TTS voice creation $0.20/voice; free quota: 10 voice creations in first 90 days (Singapore region)"
free_tier: true
open_source: true
api: true
self_host: true
model_routing: locked
verdict: situational
verdict_text: >-
  Best-in-class Chinese TTS naturalness, plus open-source weights you can
  self-host. Pricing is token-based and can be confusing compared with
  per-minute audio APIs; English quality is good but not market-leading.
strengths:
  - "Top-tier naturalness for Chinese text-to-speech."
  - "Open-source weights that can be self-hosted."
  - "API and voice-creation options on Alibaba Cloud."
use_for:
  - "Chinese-language applications that need natural-sounding TTS."
  - "Teams that can self-host to keep voice data off shared cloud endpoints."
skip_when:
  - "You need simple per-minute pricing and predictable audio costs."
  - "English or non-Chinese output must be market-leading."
  - "Alibaba Cloud region and compliance requirements are a blocker."
limitations:
  - Token/character pricing can be confusing vs per-minute audio APIs.
  - Commercial rights and voice-cloning ethics need review.
  - English and non-Chinese quality are good but not market-leading.
  - Same Alibaba Cloud region/compliance friction as other Qwen services.
