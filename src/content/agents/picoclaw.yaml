summary: >-
  PicoClaw targets the edge-device end of the personal-agent market. The
  direction is valuable because it separates small runtime requirements from
  remote model inference, but Noemium has not reproduced its footprint claims.
best_for:
  - Edge-agent experiments on old phones and single-board computers
  - Measuring runtime footprint separately from model requirements
deployment:
  - local
  - self-hosted
limitations:
  - Noemium has not reproduced installation, resource usage, or channel reliability.
  - Hardware, remote-provider, update, and secret-storage assumptions need field testing.
