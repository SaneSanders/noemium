obituary: >-
  A TTS API and voice library that once mattered. Meta acquihired the team and
  the platform closed on 2025-12-31 — accounts, saved audio and voice clones
  deleted, no migration path offered. Sites still taking payments as "Play.ht"
  are impersonators. Successors: ElevenLabs, Murf.
