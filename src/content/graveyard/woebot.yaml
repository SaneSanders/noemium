name: Woebot
url: https://woebothealth.com/
category: agents
died: "2025-06-30"
cause: >-
  Woebot Health retired the consumer app — FDA marketing-authorization costs and
  LLM-in-therapy uncertainty made the direct-to-consumer model unsustainable.
obituary: >-
  CBT-based mental-health chatbot since 2017, reaching roughly 1.5M users. The
  consumer app was retired on June 30, 2025: sign-ups and account access were
  disabled, transcripts were available only until July 15, and data was
  anonymized by July 31. The company continues licensing the technology to
  enterprises, but the public bot is dead.
