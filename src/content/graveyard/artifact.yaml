name: Artifact
url: https://artifact.news
category: productivity
died: "2024-04-02"
cause: >-
  Acquired by Yahoo, which shut down the standalone app and absorbed the
  personalization tech into Yahoo News.
obituary: >-
  AI-personalized news app from Instagram co-founders Kevin Systrom and Mike
  Krieger, launched in 2023. The market was deemed too small by January 2024.
  Yahoo acquired the company and the standalone app ceased operation on April 2,
  2024; posts and comments were already disabled and the product was folded into
  Yahoo properties.
receipt: https://www.yahooinc.com/press/yahoo-announces-the-acquisition-of-artifact-the-news-discovery-platform-created-by-instagram-cofounders-kevin-systrom-and-mike-krieger
