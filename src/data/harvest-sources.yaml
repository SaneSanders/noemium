    helicone: https://www.helicone.ai/api/llm-costs
    litellm: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
  # LiteLLM / Helicone keys — same matching as scripts/fetch-model-data.mjs.
  # Empty litellm means "do not compare; reseller listings lie".
  match:
    - slug: gpt-5-6-sol
      litellm: [gpt-5.6-sol]
      context_override: 1050000
    - slug: gpt-5-6-terra
      litellm: [gpt-5.6-terra]
      context_override: 1050000
