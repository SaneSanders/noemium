# Harvest source registry — what we watch, how often, from where.
# Collectors observe. They never write verdicts or last_verified.
# HTML changelog scrapers are out of v1: layout changes are not deterministic.
# GitHub releases + RSS cover the same job for now.
version: 1
stale_days: 60
rss_lookback_days: 7
kinds:
  github: true
  status: true
  rss: true
  models: true
  freshness: true

github:
  derive_from_catalog: true
  overrides: []

status_pages:
  - id: openai
    name: OpenAI
    url: https://status.openai.com/api/v2/status.json
    related: [chatgpt, openai-api, openai-codex, openai-agents-sdk, openai-responses]
  - id: anthropic
    name: Anthropic
    url: https://status.anthropic.com/api/v2/status.json
    related: [claude, claude-code]
  - id: github
    name: GitHub
    url: https://www.githubstatus.com/api/v2/status.json
    related: [github-copilot]
  - id: cursor
    name: Cursor
    url: https://status.cursor.com/api/v2/status.json
    related: [cursor]
  - id: vercel
    name: Vercel
    url: https://www.vercel-status.com/api/v2/status.json
    related: [v0, v0-dev]
  - id: groq
    name: Groq
    url: https://groqstatus.com/api/v2/status.json
    related: [groq]
  - id: replicate
    name: Replicate
    url: https://www.replicatestatus.com/api/v2/status.json
    related: [replicate]
  - id: cloudflare
    name: Cloudflare
    url: https://www.cloudflarestatus.com/api/v2/status.json
    related: [cloudflare-vibesdk]
  - id: elevenlabs
    name: ElevenLabs
    url: https://status.elevenlabs.io/api/v2/status.json
    related: [elevenlabs]
  - id: notion
    name: Notion
    url: https://www.notion-status.com/api/v2/status.json
    related: [notion-ai, notion-calendar]

rss:
  - id: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    related: [chatgpt, openai-api, openai-codex]
  - id: huggingface-blog
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    related: [hugging-face]
  - id: github-ai
    name: GitHub Blog (AI)
    url: https://github.blog/ai-and-ml/feed/
    related: [github-copilot]
  - id: google-ai
    name: Google AI Blog
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
    related: []

models:
