name: Content data refresh

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, after stale-check
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run weekly-diff
      - run: npm run price-history
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-data
          path: |
            src/data/changelog.json
            src/data/price-history.json
      - name: Open draft PR if data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/changelog.json src/data/price-history.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git checkout -b "chore/content-data-$(date -u +%Y-W%V)"
          git commit -m "chore: refresh changelog and price-history JSON"
          git push -u origin HEAD
          gh pr create --draft --base main \
            --title "chore: refresh changelog.json and price-history.json" \
            --body "Automated weekly data refresh. Review, then merge — merge to main deploys."
