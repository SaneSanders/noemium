name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: rsync to Vultr VPS
        run: |
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          echo "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          rsync -avzr --delete --quiet \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/noemium/
