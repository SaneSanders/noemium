name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # daily world-status snapshot at build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Snapshot vendor status
        run: node scripts/harvest.mjs run --kind status --snapshot --no-issue
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
      - name: rsync to Vultr VPS
        # Generate VPS_HOST_KEY once via `ssh-keyscan -H <vps-host>`, store the
        # output as the VPS_HOST_KEY repository secret, and rotate on host changes.
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts"
          rsync -avzr --delete --quiet \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "${VPS_USER}@${VPS_HOST}:/var/www/noemium/"
      - name: Build MCP snapshot
        run: npm run mcp:snapshot
      - name: Install MCP worker deps
        run: npm --prefix mcp ci
      - name: Test MCP worker
        run: npm --prefix mcp test
      - name: Deploy MCP worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config mcp/wrangler.jsonc
