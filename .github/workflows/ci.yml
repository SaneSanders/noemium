name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # track-record tests mine git history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content (schema, cross-refs, undeclared affiliates)
        run: npm run validate
      - name: Design-token police (no hex colors outside tokens.css)
        run: |
          if grep -RnE '#[0-9a-fA-F]{3,8}\b' src --include='*.astro' --include='*.css' --include='*.ts' --include='*.tsx' | grep -v 'src/styles/tokens.css'; then
            echo "::error::Hex color found outside src/styles/tokens.css — see DESIGN.md"
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:dist
      - name: MCP worker deps
        run: npm --prefix mcp ci
      # The snapshot must exist before typecheck and tests: the worker imports
      # mcp/data/snapshot.json statically, and every mcp test reads it. The
      # snapshot is generated from dist/api/*.json, so it has to follow the build.
      - name: MCP snapshot
        run: npm run mcp:snapshot
      - name: MCP worker typecheck
        run: npm --prefix mcp run typecheck
      - name: MCP worker tests
        run: npm --prefix mcp test
